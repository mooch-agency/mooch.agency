/* ============================================================================
   The Board: the mooch.agency AX leaderboard, 01 Ranked. Four iterations were
   built and reviewed on 9 Sep 2026; Tahi picked this one on 10 Sep and the
   others are retired. Shared CSS is linked, not copied; everything inline is
   specific to this page. Data is the real 8 Sep 2026 scan. Nothing is invented,
   and every count in the copy is derived from the data.
   ========================================================================== */

/* --- tokens, page-local ---------------------------------------------------
   tokens.css, motion.css and ui.css are linked above, per CLAUDE.md. Only
   what this page adds lives here. The pip and highlight colours derive from
   shared tokens so they follow any palette change; --band and --t-disclose
   are the two genuinely new values, and they move to tokens.css the day this
   leaves .scratch and becomes a page. */
:root {
  --t-disclose:.34s;
  --board:var(--paper);
  --band:#f3f3f5;                 /* group-header ground, between --paper and --surface */
  --pip-on:var(--ink);            /* a check that passed */
  --pip-off:var(--hairline);      /* a check that did not */
  --pip-part:var(--hairline-focus);
  --hi:color-mix(in srgb, var(--claude) 14%, transparent); /* find-your-chain highlight */
}
/* Dark. tokens.css itself says a page may override any token in its own :root,
   and the ticket asks for light and dark. Only values change, never rules;
   the pip colours follow automatically because they point at shared tokens. */
@media (prefers-color-scheme: dark) {
  :root {
    --black:#f2f2f4; --ink:#f2f2f4; --paper:#0b0b0c; --surface:#141416;
    --muted:#9a9aa1; --muted-small:#a9a9b0;
    --hairline:#2b2b2e; --hairline-focus:#5b5b61;
    --error:#ff8080; --success:#5cc98d;
    --shadow-border:0 0 0 1px rgba(255,255,255,.09);
    --shadow-border-hover:0 0 0 1px rgba(255,255,255,.16);
    --board:#0f0f11; --band:#191a1c;
    --hi:color-mix(in srgb, var(--claude) 20%, transparent);
  }
}

/* --- base -------------------------------------------------------------- */
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden; /* nothing on this page may scroll the page sideways */
}
p { margin:0; }
a { color:inherit; }
/* ui.css's .pill sets no font-family, so form controls fall back to the UA
   font without this. */
button, input { font-family:inherit; }
/* .empty and td.detail set display, which out-ranks the UA sheet's [hidden]
   rule and left the "no match" block on screen at all times. */
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--claude); outline-offset:2px; }
.sr {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
@media (prefers-reduced-motion:reduce) {
  * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
  /* The disclosures hide their content with a delayed visibility flip. Without
     this the content would stay unreadable for a third of a second after it
     has already finished opening. */
  .morewrap > .morein, .detwrap > .detin { transition-delay:0s !important; }
}

/* --- disclosure (shared) ------------------------------------------------ */
/* A button plus a 0fr/1fr grid. The button keeps real button semantics, so
   Enter and Space work without a keydown handler; the grid animates height
   without ever measuring anything, so the collapsed state cannot jump. */
.moretoggle {
  appearance:none; background:none; border:0; padding:9px 0; margin:0;
  font:inherit; font-size:13px; color:var(--ink); cursor:pointer;
  display:inline-flex; align-items:center; gap:8px; text-align:left;
  text-decoration:underline; text-underline-offset:4px;
  text-decoration-color:var(--hairline-focus);
  transition:text-decoration-color var(--t-deliver) var(--ease-deliver);
}
.moretoggle:hover { text-decoration-color:var(--ink); }
.moretoggle .chev {
  display:inline-block; font-family:var(--mono); color:var(--muted-small);
  transition:transform var(--t-deliver) var(--ease-deliver);
}
.moretoggle[aria-expanded="true"] .chev { transform:rotate(90deg); }
/* .detwrap is the same recipe wrapped around an opened row. */
.morewrap, .morein > * + * { margin-top:9px; }

/* --- page chrome (the design deck around the mocks) --------------------- */
.deck { max-width:var(--max); margin:0 auto; padding:30px var(--pad-x) 0; }
.eyebrow {
  font-family:var(--mono); font-size:11px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--muted-small); margin:0;
}
.pagetitle { font-family:var(--serif); font-size:clamp(26px,3.4vw,34px); line-height:1.05; margin:6px 0 0; font-weight:400; letter-spacing:-.01em; }
/* --- the mock frame ----------------------------------------------------- */
.frame {
  margin:18px auto 0; border:1px solid var(--hairline); border-radius:14px;
  background:var(--board); overflow:hidden; box-shadow:var(--shadow-border);
}
.frametab {
  display:flex; justify-content:space-between; gap:12px; align-items:center;
  padding:9px 16px; border-bottom:1px solid var(--hairline); background:var(--surface);
  font-family:var(--mono); font-size:11px; color:var(--muted-small); letter-spacing:.06em;
}
.pad { padding:clamp(20px,2.6vw,32px); }

/* --- hero ---------------------------------------------------------------- */
.display {
  font-family:var(--serif); font-weight:400; letter-spacing:-.015em;
  font-size:clamp(28px,3.6vw,40px); line-height:1.04; margin:10px 0 0;
  text-wrap:balance; max-width:34ch;
}
.display em { font-style:italic; }
.lede { margin-top:12px; font-size:clamp(15px,1.3vw,16.5px); color:var(--ink); max-width:70ch; text-wrap:pretty; }

.morein p { font-size:13.5px; color:var(--muted); text-wrap:pretty; }
/* The trust stamp now lives at the foot of the page, alongside the notes. */
.stamp {
  margin:0; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--muted-small); display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center;
}
.stamp .dot { width:6px; height:6px; border-radius:50%; background:var(--success); display:inline-block; margin-right:6px; }

/* --- controls row: the toggle and the filter, directly above the header --- */
.controls {
  display:flex; gap:12px 20px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; margin-top:20px;
}
.ctrl-left { display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex:0 0 auto; margin-left:auto; min-width:0; }
.ctrl-left .eyebrow { flex:0 0 auto; }

.seg {
  display:inline-flex; border:1px solid var(--hairline-focus); border-radius:980px;
  padding:3px; gap:2px; background:var(--paper);
}
.seg button {
  appearance:none; border:0; background:none; font-family:inherit; font-size:13px;
  font-weight:500; color:var(--muted); padding:8px 16px; border-radius:980px; cursor:pointer;
  transition:background var(--t-deliver) var(--ease-deliver), color var(--t-deliver) var(--ease-deliver);
}
.seg button:hover { color:var(--ink); }
.seg button:active { transform:scale(.96); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

/* --- find your chain ----------------------------------------------------- */
.find { display:flex; gap:10px; align-items:center; flex:0 1 auto; min-width:0; }
.find input {
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
  border:1px solid var(--hairline-focus); border-radius:980px; padding:9px 16px;
  min-width:0; width:min(240px,52vw);
}
.find input::placeholder { color:var(--muted); }
.findnote { font-family:var(--mono); font-size:11px; color:var(--muted-small); letter-spacing:.06em; }

/* --- board table --------------------------------------------------------- */
.tablewrap { margin-top:14px; overflow-x:auto; border-top:1px solid var(--hairline); }
table.board { width:100%; border-collapse:collapse; font-size:14px; }
table.board th {
  text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.12em; color:var(--muted-small); font-weight:400;
  padding:12px 12px; border-bottom:1px solid var(--hairline); white-space:nowrap;
}
table.board td { padding:11px 12px; border-bottom:1px solid var(--hairline); vertical-align:middle; }
table.board tr.row { transition:background var(--t-deliver) var(--ease-deliver); }
table.board tr.row:hover { background:var(--surface); }
table.board tr.row.dim { opacity:.34; }
table.board tr.row.hit { background:var(--hi); box-shadow:inset 3px 0 0 var(--claude); }
/* The whole row is the hit target. The chevron stays the real button, so the
   row keeps its table semantics and the control keeps its aria state; a click
   anywhere on the row is forwarded to it, and its focus ring is drawn on the
   whole row so keyboard and mouse land in the same place. */
table.board tr.row[data-open] { cursor:pointer; }
/* An open row has to look open. Without this the only signal is aria-expanded
   and the panel below, so a row you just opened is identical to one you did
   not. The inset bar matches the one the find filter uses for a hit. */
table.board tr.row[aria-expanded="true"] {
  background:var(--surface); box-shadow:inset 3px 0 0 var(--hairline-focus);
}
table.board tr.row[data-open]:active { background:var(--band); }
table.board tr.row:focus-visible {
  outline:2px solid var(--claude); outline-offset:-2px; background:var(--surface);
}
.rank { font-family:var(--mono); font-size:13px; color:var(--muted-small); font-variant-numeric:tabular-nums; width:1%; white-space:nowrap; }
.brand { font-weight:600; letter-spacing:-.01em; }
.brandurl { display:block; font-family:var(--mono); font-size:11px; color:var(--muted-small); margin-top:2px; }
.fnmark { font-size:10px; vertical-align:super; color:var(--claude); margin-left:2px; font-family:var(--mono); }

/* score meter: five segments, one per level. The number is the value, the
   segments are only there so a tie is visible at a glance. */
.score { display:inline-flex; align-items:center; gap:9px; white-space:nowrap; }
.meter { display:inline-flex; gap:2px; }
.meter i { width:9px; height:16px; border-radius:2px; background:var(--pip-off); display:block; }
.meter i.on { background:var(--pip-on); }
.snum { font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; }


/* The builder name as a bordered tag, not loose mono text: it is a different
   kind of fact from the chain name and the url above it, and the outline is
   what separates it from the rest of the row's copy at a glance. */
.platpill {
  display:inline-block; font-family:var(--mono); font-size:11px; color:var(--muted-small);
  border:1px solid var(--hairline); border-radius:7px; padding:4px 10px; white-space:nowrap;
}
/* Iteration 01 only. Its Docs platform column comes and goes with the view,
   so its widths have to be law rather than a hint: with the default
   table-layout:auto the browser re-measures every column against its content,
   and a long platform string ("Docusaurus \u00b7 Vercel") widens that column,
   takes the space out of Chain and drags the score column sideways. Fixed
   layout pins the colgroup widths, so the two views line up exactly. */
#p-a table.board { table-layout:fixed; }
#p-a table.board td, #p-a table.board th { overflow:hidden; text-overflow:ellipsis; }
/* The 30D delta: a coloured triangle and a number once there is a second scan
   to diff against, a flat muted dash until then. */
.movecell { font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted-small); }
.movecell.up { color:var(--success); }
.movecell.down { color:var(--error); }
/* Padding lives on the inner element, not the cell, so a closed row collapses
   to nothing instead of holding 48px of empty surface. */
table.board td.detail { background:var(--surface); padding:0; }
.detwrap {
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows var(--t-disclose) var(--ease-decide);
}
.detwrap[data-open="true"] { grid-template-rows:1fr; }
/* visibility, delayed, so collapsed content leaves the accessibility tree
   rather than merely being clipped. */
.detwrap > .detin {
  overflow:hidden; min-height:0; visibility:hidden;
  transition:visibility 0s linear var(--t-disclose);
}
.detwrap[data-open="true"] > .detin { visibility:visible; transition-delay:0s; }
.detpad { padding:22px 12px 26px 3.5em; display:grid; gap:20px; }


/* --- the open row: next level, with causes --------------------------------
   Chosen 10 Sep over a five-group evidence panel and an artefact manifest.
   The reader gets the one move that changes their score, knock-on failures
   nest under the thing that causes them, and the full list sits behind a
   disclosure for anyone verifying. */
.rung {
  display:grid; gap:6px; padding:14px 16px; border:1px solid var(--hairline);
  border-radius:12px; background:var(--paper);
}
.rungtag { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-small); }
.rungline { font-size:15px; font-weight:600; text-wrap:pretty; }
.rungsub { font-size:13px; color:var(--muted); text-wrap:pretty; max-width:62ch; }
.blocker { display:grid; gap:10px; }
.bitem { display:grid; grid-template-columns:16px 1fr; gap:9px; align-items:start; }
.bitem .bico { line-height:0; color:var(--pip-off); transform:translateY(3px); }
.bname { font-size:13.5px; font-weight:600; }
.baddr { font-family:var(--mono); font-size:11px; color:var(--muted-small); display:block; margin-top:2px; word-break:break-all; }
/* A failure that only fails because its parent is missing is not a second
   job. It hangs under its cause, and the rule on the left says so. */
.conseq { margin-top:7px; padding-left:11px; border-left:2px solid var(--hairline); display:grid; gap:4px; }
.conseq span { font-size:12px; color:var(--muted-small); line-height:1.4; }
.allchecks { display:grid; padding-top:4px; }
.mrow {
  display:grid; grid-template-columns:16px minmax(0, 1fr) auto; gap:9px; align-items:baseline;
  padding:7px 0; border-bottom:1px solid var(--hairline);
}
.mrow:last-child { border-bottom:0; }
.mico { line-height:0; transform:translateY(3px); color:var(--pip-off); }
.mrow.ok .mico { color:var(--success); }
.mwhat { font-size:13px; }
.mwhere { font-family:var(--mono); font-size:11px; color:var(--muted-small); display:block; margin-top:2px; word-break:break-all; }
.mstate { font-family:var(--mono); font-size:11px; color:var(--muted-small); white-space:nowrap; }
.mrow.ok .mstate { color:var(--success); }

/* --- CTA, which now lives only inside an opened row ----------------------- */
/* Concentric: the field's 10px plus the box's 14px padding gives 24px here.
   The submit pill stays fully round on purpose, a pill being a shape rather
   than a nested box. */
.cta { border:1px solid var(--hairline); border-radius:24px; padding:14px 16px; background:var(--paper); display:grid; gap:12px; }
.ctalabel { font-size:14px; font-weight:600; max-width:56ch; }
.ctasub { font-size:13px; color:var(--muted); max-width:64ch; margin-top:-6px; }
form.mail { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.mailfield {
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
  border:1px solid var(--hairline-focus); border-radius:10px;
  display:inline-flex; align-items:center; flex:1 1 200px; min-width:0; max-width:330px; padding:0 12px;
}
/* The input drops its own outline so the ring can sit on the whole field, which is
   what reads as one address. The ring has to be here or the primary CTA has no
   visible focus at all. */
.mailfield:focus-within { outline:2px solid var(--claude); outline-offset:2px; }
.mailfield input {
  border:0; background:none; font-family:inherit; font-size:14px; color:var(--ink);
  padding:10px 0; min-width:40px; flex:1 1 auto; width:100%; outline:none;
}
.mailfield .at { font-family:var(--mono); font-size:13px; color:var(--muted-small); white-space:nowrap; }
.secondary { font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--hairline-focus); }
.secondary:hover { color:var(--ink); text-decoration-color:var(--ink); }
.said { font-size:13px; color:var(--success); }

/* --- the pitch under the board: one line, one link, no form --------------- */
.pitch { margin-top:20px; display:flex; gap:6px 18px; flex-wrap:wrap; align-items:baseline; }
.pitch p { font-size:13.5px; color:var(--ink); max-width:74ch; text-wrap:pretty; }

/* --- footnotes ------------------------------------------------------------- */
.foot { margin-top:26px; padding-top:20px; border-top:1px solid var(--hairline); display:grid; gap:12px; }
.foot p { font-size:12.5px; color:var(--muted); max-width:82ch; text-wrap:pretty; }
.foot b { color:var(--ink); font-weight:600; }
.foot ol { margin:0; padding-left:18px; display:grid; gap:8px; }
.foot li { font-size:12.5px; color:var(--muted); max-width:82ch; text-wrap:pretty; }
.empty { padding:26px 12px; font-size:14px; color:var(--muted); display:grid; gap:10px; justify-items:start; }

/* --- responsive ------------------------------------------------------------- */
.onsm { display:none; }
@media (max-width:960px) {
  .opt { display:none; }
  .onsm { display:block; margin-top:5px; }
}
@media (max-width:720px) {
  .opt2 { display:none; }
  .pad { padding:20px; }
  table.board th, table.board td { padding:10px 8px; }
  .controls { align-items:stretch; }
  .find { flex:1 1 100%; }
  .find input { width:100%; }
}
@media (max-width:520px) {
  .meter i { width:7px; height:14px; }
  form.mail { flex-direction:column; align-items:stretch; }
  .mailfield { max-width:none; }
  .pill { width:100%; }
}
</style>

<script>
(function () {
"use strict";

var DATA = JSON.parse(document.getElementById("scan").textContent);
var ROWS = DATA.rows;

/* Every number in the copy comes from here. The board is re-scanned weekly and
   rows come and go, so a literal count in a sentence is a bug waiting to ship. */
var N = ROWS.length;                                  /* chains on the board */
var SITES = N * 2;                                    /* two doors each */

var CHECK_NAME = {
  robotsTxt: "robots.txt", sitemap: "Sitemap",
  robotsTxtAiRules: "Rules for AI crawlers", contentSignals: "Content Signals",
  markdownNegotiation: "Markdown version",
  linkHeaders: "Link headers", dnsAid: "Agent records in DNS",
  mcpServerCard: "Tool card", a2aAgentCard: "Agent card", agentSkills: "Skills index",
  apiCatalog: "API catalogue", authMd: "Sign-in guide", oauthDiscovery: "Sign-in metadata",
  oauthProtectedResource: "Protected resource metadata", webMcp: "Tools built into the page",
  ard: "Capability manifest"
};
var LEVEL_NAME = ["Not Ready","Basic Web Presence","Bot-Aware","Agent-Readable","Agent-Integrated","Agent-Native"];
/* Checks Cloudflare runs but never scores. Derived, not asserted: the count in
   the footnote is however many of these the scan actually returned. */
var PAYMENT_KEYS = ["x402","mpp","ucp","acp","ap2"];

var VIEW_COPY = {
  site: { label: "Website", of: "website" },
  docs: { label: "Docs", of: "docs" }
};

/* --- helpers --------------------------------------------------------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
  });
}
function viewOf(row, view) { return view === "site" ? row.site : row.docs; }
function meter(lv) {
  var s = '<span class="meter" aria-hidden="true">';
  for (var i = 1; i <= 5; i++) s += '<i class="' + (i <= lv ? "on" : "") + '"></i>';
  return s + "</span>";
}
/* Pips plus the number. The level name is no longer printed next to the score,
   so it is carried for screen readers only, everywhere. */
function score(lv) {
  return '<span class="score">' + meter(lv) +
    '<span class="snum">' + lv + "/5</span>" +
    '<span class="sr">, ' + LEVEL_NAME[lv] + "</span></span>";
}
function fmtDate(iso) {
  var d = new Date(iso);
  return d.getUTCDate() + " " +
    ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getUTCMonth()] +
    " " + d.getUTCFullYear();
}
var SCAN_DATE = fmtDate(DATA.scannedAt);

/* Counts used in copy, computed from the data so the copy can never drift. */
function tally(view) {
  var t = {};
  ROWS.forEach(function (r) { var l = viewOf(r, view).level; t[l] = (t[l] || 0) + 1; });
  return t;
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

/* --- sorting and ranking ---------------------------------------------------- */
function sorted(view) {
  return ROWS.slice().sort(function (a, b) {
    var d = viewOf(b, view).level - viewOf(a, view).level;
    return d || a.tvs - b.tvs;
  });
}

/* What each level actually requires, derived from the 44 scanned hosts rather
   than read from Cloudflare's nextLevel.requirements. That field is a list of
   suggested fixes for a coding agent (its entries carry a prompt and a
   skillUrl), not a gate: it names Link headers for INTMAX's 1/5, yet all 21
   hosts sitting at 1/5 fail Link headers. A level's gate here is every check
   passed by 100% of hosts at or above that level.
   Two limits of the data itself: nothing on the board scored 2/5, so levels 2
   and 3 are indistinguishable, and level 5's gate comes from one host. */
var GATES = {
  1: ["robotsTxt","robotsTxtAiRules","sitemap"],
  2: ["robotsTxt","robotsTxtAiRules","sitemap","contentSignals","markdownNegotiation"],
  3: ["robotsTxt","robotsTxtAiRules","sitemap","contentSignals","markdownNegotiation"],
  4: ["robotsTxt","robotsTxtAiRules","sitemap","contentSignals","markdownNegotiation","linkHeaders"],
  5: ["robotsTxt","robotsTxtAiRules","sitemap","contentSignals","markdownNegotiation","linkHeaders",
      "mcpServerCard","agentSkills","apiCatalog","oauthDiscovery","webMcp"]
};
/* The next level this data can actually tell apart. Levels 2 and 3 share a
   gate here (nothing on the board scored 2/5), so a site at 1/5 is told the
   truth: what it needs takes it to 3/5, and the "nothing scored 2/5" note
   below the board stays consistent with the panel. */
function nextTarget(level) {
  if (level >= 5) return null;
  var t = level + 1;
  while (t < 5 && GATES[t + 1].join() === GATES[t].join()) t++;
  return t;
}
/* Spelled out because it sits in a sentence, not a cell. */
var WORD = ["no","one","two","three","four","five","six","seven","eight","nine","ten"];

/* The checks Cloudflare scores: everything except the payment family, which
   it runs but never counts, and anything it reports as neutral. */
function scoredChecks(view) {
  var out = {};
  Object.keys(view.checks).forEach(function (k) {
    if (PAYMENT_KEYS.indexOf(k) !== -1) return;
    if (view.checks[k].s === "neutral") return;
    out[k] = view.checks[k];
  });
  return out;
}
/* The address the scanner actually requested, shortened to the path. */
function shortAddr(a, host) {
  if (!a) return "";
  if (a.indexOf("dns-query") !== -1) {
    var m = /name=([^&]+)/.exec(a);
    return m ? decodeURIComponent(m[1]) : "DNS record";
  }
  return a.replace(/^https?:\/\//, "").replace(host, "") || "/";
}

function nextPanel(view, row, id) {
  var ch = scoredChecks(view), keys = Object.keys(ch);
  var target = nextTarget(view.level);
  var failing = keys.filter(function (k) { return ch[k].s !== "pass"; });

  /* A knock-on failure names its blocker in its own message ("Cannot check X
     without robots.txt"), so the dependency comes from the data, not a guess. */
  var conseq = {}, claimed = {};
  failing.forEach(function (k) {
    var m = /without ([\w.\-]+)/i.exec(ch[k].m);
    if (!m) return;
    var owner = keys.filter(function (o) {
      return CHECK_NAME[o] && CHECK_NAME[o].toLowerCase().indexOf(m[1].toLowerCase()) === 0;
    })[0];
    if (owner && owner !== k) { (conseq[owner] = conseq[owner] || []).push(k); claimed[k] = 1; }
  });
  var blockers = target ? GATES[target].filter(function (k) {
    return ch[k] && ch[k].s !== "pass" && !claimed[k];
  }) : [];

  var html = "";
  if (!target) {
    html += '<div class="rung"><span class="rungtag">Top of the board</span>' +
      '<p class="rungline">Everything Cloudflare scores is in place.</p></div>';
  } else {
    var n = blockers.length, word = WORD[n] || String(n);
    html += '<div class="rung"><span class="rungtag">Moving up</span>' +
      '<p class="rungline">To reach ' + target + "/5 you need " + word + " thing" + (n === 1 ? "" : "s") + ".</p>" +
      /* Only worth saying while a level still sits above the next one. At 4/5
         the next step is the last, so there is nothing left to unlock in turn. */
      (target < 5
        ? '<p class="rungsub">Cloudflare\u2019s scoring system means higher levels are unlocked one at a time.</p>'
        : "") +
      "</div>";
    html += '<div class="blocker">' + blockers.map(function (k) {
      var c = ch[k], kids = conseq[k] || [];
      return '<div class="bitem"><span class="bico">' + ico("n", 14) + "</span>" +
        '<span><span class="bname">' + esc(CHECK_NAME[k] || k) + "</span>" +
        (c.a ? '<span class="baddr">' + esc(shortAddr(c.a, view.url)) + "</span>" : "") +
        (kids.length ? '<span class="conseq">' + kids.map(function (x) {
          return "<span>Also blocks " + esc(CHECK_NAME[x] || x) + "</span>";
        }).join("") + "</span>" : "") +
        "</span></div>";
    }).join("") + "</div>";
  }

  /* The full list, for anyone checking our working. Same disclosure pattern
     as the rest of the page. */
  var listId = "all-" + id;
  html += '<button class="moretoggle" type="button" aria-expanded="false" aria-controls="' + listId + '">' +
    '<span class="chev" aria-hidden="true">&rsaquo;</span>Show all ' + keys.length + " checks</button>" +
    '<div class="morewrap" id="' + listId + '" data-open="false"><div class="morein"><div class="allchecks">' +
    keys.map(function (k) {
      var c = ch[k], ok = c.s === "pass";
      return '<div class="mrow' + (ok ? " ok" : "") + '" title="' + esc(c.m) + '">' +
        '<span class="mico">' + ico(ok ? "y" : "n", 11) + "</span>" +
        '<span><span class="mwhat">' + esc(CHECK_NAME[k] || k) + "</span>" +
        (c.a ? '<span class="mwhere">' + esc(shortAddr(c.a, view.url)) + "</span>" : "") + "</span>" +
        '<span class="mstate">' + (ok ? "found" : "missing") + "</span></div>";
    }).join("") + "</div></div></div>";
  return html;
}

/* --- evidence --------------------------------------------------------------- */
/* One icon set for every found/missing mark, drawn rather than typed, so it
   holds a consistent stroke weight and optical centre. 2px stroke to sit
   beside semibold labels; currentColor so state is colour. */
function ico(kind, size) {
  var w = size || 12;
  var open = '<svg class="ico" width="' + w + '" height="' + w + '" viewBox="0 0 16 16" ' +
    'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true" focusable="false">';
  if (kind === "y") return open + '<path d="M3 8.5l3.2 3.2L13 5"/></svg>';
  return open + '<path d="M4 8h8"/></svg>';
}
/* Cloudflare's messages usually restate their own subject, and the label
   beside them already says it: "Tool card: MCP Server Card found at /x" reads
   the fact twice. Strip the leading subject when a result verb follows it, so
   the label carries the noun and the value carries the finding. Purely
   display: the untouched message stays in the title attribute. */
/* No history yet: one scan exists, so 30D is a placeholder until a second
   scan lands. The component supports up/down (green triangle, red triangle,
   the delta) for when it does; today every row renders the flat, muted dash.
   The dash is decorative; the sr text carries the actual state so it does not
   read as a broken cell to a screen reader. */
/* Cloudflare reports the docs platform as "generator \u00b7 host", e.g.
   "Docusaurus \u00b7 Vercel". We show the generator only, and the decision is
   evidenced rather than aesthetic: the generator has a documented mechanism
   for these checks (Mintlify and GitBook auto-generate llms.txt, llms-full.txt
   and per-page Markdown with no configuration; Docusaurus ships no official
   llms.txt plugin, so it depends on a community one being installed), which is
   why all 5 GitBook rows sit on exactly 3/5 while Docusaurus scatters 0 to 4.
   The host has no such mechanism: it serves what you deploy. The one exception
   is Cloudflare's managed robots.txt, which injects Content Signals
   automatically, but it is demonstrably not switched on for anything here:
   0 of 6 Cloudflare-hosted websites pass Content Signals, and one of the four
   Cloudflare-hosted docs has no robots.txt at all. Naming the host would
   advertise a cause that is not operating on this board. The caveat lives in
   the method notes instead. The scan record keeps Cloudflare's full string. */
function platformText(raw) {
  return raw.split(" \u00b7 ")[0];
}
function moveCell(cls) {
  return '<td class="' + cls + '"><span class="movecell flat" aria-hidden="true">&#8211;</span>' +
    '<span class="sr">No history yet</span></td>';
}

/* --- the CTA, which now only ever appears inside an opened row -------------- */
var seq = 0;
function ctaForm(opts) {
  var id = "f" + (++seq);
  return '<div class="cta">' +
    '<p class="ctalabel">' + esc(opts.label) + "</p>" +
    (opts.sub ? '<p class="ctasub">' + esc(opts.sub) + "</p>" : "") +
    '<form class="mail" novalidate>' +
      '<span class="mailfield"><label class="sr" for="' + id + '">The bit before the @ in your work email</label>' +
        '<input id="' + id + '" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="you">' +
        '<span class="at" data-role="at">@' + esc(opts.domain) + "</span></span>" +
      '<button class="pill" type="submit">Get the full report <span class="arrow">&rarr;</span></button>' +
      '<span class="said" role="status" data-role="said"></span>' +
    "</form></div>";
}
function rowCta(row, which) {
  return ctaForm({
    domain: row.domain,
    label: "Get " + row.name + "\u2019s full " + which + " report.",
    sub: "Every check, the exact fix, and a weekly re-scan once you\u2019re climbing."
  });
}
/* One plain line and one link under the board. No form above the ranking. */
function pitch() {
  return '<div class="pitch"><p>We\u2019ll send the full report: every check, the exact fix, ' +
    "and how you compare.</p>" +
    '<a class="secondary" href="#" data-noop>Your L2 missing? Let us know.</a></div>';
}

/* --- shared page furniture --------------------------------------------------- */
/* The fold, in order: eyebrow, headline, lede, method disclosure. The trust
   stamp moved to the foot of the page; nothing else stands between this and
   row one. */
function hero(o) {
  return "<div>" +
    '<p class="eyebrow">Agent experience</p>' +
    '<h2 class="display">' + o.headline + "</h2>" +
    '<p class="lede">' + esc(o.lede) + "</p>" +
    '<button class="moretoggle" type="button" aria-expanded="false" aria-controls="' + o.methodId + '" style="margin-top:12px;">' +
      '<span class="chev" aria-hidden="true">&rsaquo;</span>How scoring works</button>' +
    '<div class="morewrap" id="' + o.methodId + '" data-open="false"><div class="morein">' +
      "<p>We use Cloudflare\u2019s agent-readiness API and scoring system to rank each website. " +
      "It scores how well agents can find info, not whether it\u2019s correct or updated. " +
      "Rescanned weekly.</p>" +
    "</div></div>" +
  "</div>";
}

/* The toggle and the filter on one row, directly above the table header. */
function controls(o) {
  return '<div class="controls">' +
    '<div class="find">' +
      '<label class="sr" for="' + o.findId + '">Find your chain</label>' +
      '<input id="' + o.findId + '" type="search" placeholder="Find your chain" ' +
        'aria-label="Find your chain" autocomplete="off" data-role="find">' +
      '<span class="findnote" role="status" data-role="findnote"></span>' +
    "</div>" +
    '<div class="ctrl-left">' + o.toggle + "</div>" +
  "</div>";
}
function segToggle(view) {
  return '<div class="seg" role="group" aria-label="Which site to rank">' +
    '<button type="button" data-view="site" aria-pressed="' + (view === "site") + '">Website</button>' +
    '<button type="button" data-view="docs" aria-pressed="' + (view === "docs") + '">Docs</button></div>';
}

function footnotes() {
  var t3 = tally("docs")[3] || 0;
  var plat3 = {};
  ROWS.forEach(function (r) { if (r.docs.level === 3) plat3[r.docs.platform] = 1; });
  var plats = Object.keys(plat3);
  var payN = PAYMENT_KEYS.filter(function (k) { return k in ROWS[0].site.checks; }).length;
  /* Which scores nobody reached, said by looking rather than by remembering. */
  var seen = {};
  ROWS.forEach(function (r) { seen[r.site.level] = 1; seen[r.docs.level] = 1; });
  var missing = [0,1,2,3,4,5].filter(function (lv) { return !seen[lv]; });
  var scale = LEVEL_NAME.map(function (n, i) { return i + "/5 " + n; }).join(", ");

  /* Evidence for the "we name the builder, not the host" note below: every
     host on the board, website and docs, that Cloudflare serves. */
  var cfHosts = [];
  ROWS.forEach(function (r) {
    ["site", "docs"].forEach(function (k) { if (/Cloudflare/.test(r[k].platform)) cfHosts.push(r[k]); });
  });
  var cfTotal = cfHosts.length;
  var cfPass = cfHosts.filter(function (h) { return h.checks.contentSignals.s === "pass"; }).length;
  var cfNoRobots = cfHosts.filter(function (h) { return h.checks.robotsTxt.s !== "pass"; }).length;

  var items = [
    "<b>The tool that builds the docs does some of the work.</b> All " + plural(t3, "chain") +
      " scoring 3/5 on the docs view run " + esc(plats.join(" or ")) +
      ", which ships Content Signals and a Markdown version by default. Nobody configured it. " +
      "It is not the whole story: the same builder can score 0/5 or 4/5 elsewhere on this board, " +
      "because most of what is checked is a file the team publishes. We put the builder on the " +
      "row rather than hide it.",
    "<b>We name what builds the docs, not what serves them.</b> The scan reports both, for " +
      "example \u201cDocusaurus, served by Vercel\u201d. The builder can change a score on its " +
      "own, since some publish an AI index and a Markdown copy of every page with nothing " +
      "switched on. A host serves whatever it is given. The one host that could change a score " +
      "is Cloudflare, which can add Content Signals to a site\u2019s robots.txt automatically, " +
      "and on this board it plainly has not: " + cfPass + " of the " + plural(cfTotal, "site") +
      " served by Cloudflare " + (cfPass === 1 ? "passes" : "pass") + " that check" +
      (cfNoRobots ? ", and " + plural(cfNoRobots, "of them publishes", "of them publish") + " no robots.txt at all" : "") +
      ". Naming the host would credit a cause that is not running here.",
    "<b>Two families of checks run but never count.</b> Web Bot Auth came back neutral on all " +
      SITES + " sites, and Cloudflare does not score the " + payN +
      " agent-payment checks at all. Nothing passed those on any site here, so there is no " +
      "payment row on this board.",
    "<b>The scores are Cloudflare\u2019s, unaltered.</b> " + scale + "." +
      (missing.length
        ? " Nothing on this board scored " + missing.map(function (lv) { return lv + "/5"; }).join(" or ") +
          " on either view."
        : ""),
    "<b>Every check is a fetch, not a read.</b> The scan asks for a specific file at a specific " +
      "address and records whether it is there. It never reads your prose for meaning, so good " +
      "writing cannot raise a score and bad writing cannot lower one."
  ];
  var notes = ROWS.filter(function (r) { return r.note; });
  var html = '<div class="foot"><p class="eyebrow">Notes on the method</p><ol>' +
    items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ol>";
  html += '<p class="eyebrow" style="margin-top:8px;">Notes on ' + plural(notes.length, "row") + "</p><ol>" +
    notes.map(function (r) { return "<li><b>" + esc(r.name) + ".</b> " + esc(r.note) + "</li>"; }).join("") +
    "</ol>" +
    '<p class="stamp" style="margin-top:8px;"><span><span class="dot"></span>Scanned ' + SCAN_DATE + "</span>" +
      "<span>Re-scanned every Monday</span></p>" +
  "</div>";
  return html;
}


/* ===========================================================================
   The board. Website is the default view; a segmented toggle switches to docs
   without moving a column; the whole row opens to the next-level panel and
   the CTA. Ties are numbered and broken on L2Beat value secured.
   ========================================================================= */
function renderA(view) {
  var s = document.getElementById("p-a");
  var list = sorted(view);
  var vc = VIEW_COPY[view];
  var isDocs = view === "docs";
  s.innerHTML =
    '<div class="frametab"><span>mooch.agency/ax</span><span>The Board</span></div><div class="pad">' +
    hero({
      headline: 'How <em>agent friendly</em> is your Layer 2?',
      lede: N + " rollups, ranked on how well agents can read their website and docs.",
      methodId: "method-a"
    }) +
    controls({
      findId: "find-a",
      toggle: segToggle(view)
    }) +
    '<div class="tablewrap"><table class="board">' +
    /* Why this column order, and why the widths hold.
       Docs platform exists only on the docs view, so it has to be able to
       appear and disappear without shoving anything sideways. It sits
       immediately after Chain, the one flexible column, so its width comes
       out of Chain and nothing else: score and 30D are then measured from
       the right edge and land on the same pixel in both views. Chain simply
       gets wider on the website view, which is invisible in a left-aligned
       text column with slack in it.
       table-layout:fixed (scoped to this iteration, see the #p-a rule) is
       the other half. Without it these widths are only a suggestion, and a
       long platform string like "Docusaurus · Vercel" renegotiates the
       whole row, which is exactly what made the columns jump. */
    /* 3.5em, not 2.5em: fixed layout plus ellipsis clipped the two-digit
       ranks ("10" rendered as "1..."). */
    "<colgroup><col style=\"width:3.5em\"><col>" +
      /* 8em fits the longest builder name now shown ("Docusaurus", 72px)
         plus cell padding, and leaves the header "Docs platform" room. The
         host half used to force this to 18em. The space goes back to Chain. */
      (isDocs ? '<col class="opt" style="width:9em">' : "") +
      '<col style="width:11em"><col class="opt2" style="width:4.5em"></colgroup>' +
    "<thead><tr>" +
      '<th scope="col">#</th><th scope="col">Chain</th>' +
      (isDocs ? '<th scope="col" class="opt">Built with</th>' : "") +
      '<th scope="col">' + vc.label + " score</th>" +
      '<th scope="col" class="opt2">30D</th>' +
    "</tr></thead><tbody>" +
    list.map(function (r, i) {
      var vw = viewOf(r, view), id = "a-" + r.tvs;
      /* No chevron: it repeated what the row already does. The row is the
         control instead (role=button, tabindex, aria-expanded, wired below). */
      return '<tr class="row" data-open data-name="' + esc(r.name.toLowerCase()) + '" ' +
        'role="button" tabindex="0" aria-expanded="false" aria-controls="' + id + '" ' +
        'aria-label="Open the details for ' + esc(r.name) + '">' +
        '<td class="rank">' + (i + 1) + "</td>" +
        "<td><span class='brand'>" + esc(r.name) + (r.note ? '<span class="fnmark">note</span>' : "") +
          "</span><span class='brandurl'>" + esc(vw.url) + "</span>" +
          /* Below 960px the Docs platform column goes. It rides with the row
             instead of vanishing on a phone. */
          (isDocs ? "<span class='platpill onsm'>" + esc(platformText(r.docs.platform)) + "</span>" : "") + "</td>" +
        (isDocs ? '<td class="opt platcell"><span class="platpill">' + esc(platformText(r.docs.platform)) + "</span></td>" : "") +
        "<td>" + score(vw.level) + "</td>" +
        moveCell("opt2") +
      "</tr>" +
        /* Not [hidden]: that snapped a full panel in and out with nothing to
           interrupt. Same 0fr/1fr grid the page already uses for its other
           disclosures, so the row opens in the page's own motion language. */
        '<tr class="detailrow"><td class="detail" colspan="' + (isDocs ? 5 : 4) + '">' +
        '<div class="detwrap" id="' + id + '" data-open="false"><div class="detin">' +
        '<div class="detpad">' +
          nextPanel(vw, r, id) +
          (r.note ? '<p class="findnote">Note: ' + esc(r.note) + "</p>" : "") +
          rowCta(r, vc.of) +
        "</div></div></div></td></tr>";
    }).join("") +
    "</tbody></table></div>" +
    '<div class="empty" data-role="empty" hidden><p>No chain on the board matches that.</p><a class="secondary" href="#" data-noop>Your L2 missing? Let us know.</a></div>' +
    pitch() +
    footnotes() + "</div>";
  wire(s);
}





/* --- wiring ------------------------------------------------------------------ */

/* Walk to the detail row rather than assuming it is the next sibling. */
function detailOf(tr) {
  var n = tr.nextElementSibling;
  while (n && !n.classList.contains("detailrow")) n = n.nextElementSibling;
  return n;
}

/* Disclosures: one button, one 0fr/1fr grid, wired once wherever they appear. */
function wireDisclosures(root) {
  root.querySelectorAll(".moretoggle").forEach(function (b) {
    if (b.dataset.wired) return;
    b.dataset.wired = "1";
    b.addEventListener("click", function () {
      var w = document.getElementById(b.getAttribute("aria-controls"));
      if (!w) return;
      var open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!open));
      w.dataset.open = String(!open);
    });
  });
}

function wire(section) {
  wireDisclosures(section);

  /* view switches */
  section.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { renderA(b.dataset.view); });
  });

  /* Rows that open. The row is the control: its own aria-expanded, tabindex
     and keydown, so Enter and Space work without a native <button>. */
  function toggleRow(tr) {
    var det = detailOf(tr);
    var open = tr.getAttribute("aria-expanded") === "true";
    tr.setAttribute("aria-expanded", String(!open));
    det.querySelector(".detwrap").dataset.open = String(!open);
  }
  section.querySelectorAll("tr.row[data-open]").forEach(function (tr) {
    tr.addEventListener("click", function (e) {
      if (e.target.closest("a,button,input,select,label")) return;
      var sel = window.getSelection && window.getSelection().toString();
      if (sel) return;
      toggleRow(tr);
    });
    tr.addEventListener("keydown", function (e) {
      if (e.target !== tr) return;
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        toggleRow(tr);
      }
    });
  });

  /* find your chain: highlight and dim, never hide, so your neighbours stay
     on screen. That is the whole point of a leaderboard. */
  var find = section.querySelector("[data-role=find]");
  if (find) {
    var note = section.querySelector("[data-role=findnote]");
    var empty = section.querySelector("[data-role=empty]");
    find.addEventListener("input", function () {
      var q = find.value.trim().toLowerCase(), n = 0;
      section.querySelectorAll("tr.row").forEach(function (tr) {
        var hit = q && tr.dataset.name.indexOf(q) !== -1;
        tr.classList.toggle("hit", !!hit);
        tr.classList.toggle("dim", !!q && !hit);
        if (hit) n++;
      });
      /* Empty when nothing is typed: the total is already stated in the lede,
         and repeating it here is the third place the board says the same number. */
      note.textContent = !q ? "" : plural(n, "match", "matches");
      empty.hidden = !(q && n === 0);
      if (q && n === 1) {
        var f = section.querySelector("tr.row.hit");
        if (f) f.scrollIntoView({ block: "center" });
      }
    });
  }

  /* CTA forms. This is a mockup, so it says so rather than pretending. */
  section.querySelectorAll("form.mail").forEach(function (f) {
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var said = f.querySelector("[data-role=said]");
      var local = f.querySelector("input").value.trim();
      said.textContent = local
        ? "Mockup, so nothing was sent. On the live board this sends the report."
        : "Add the bit before the @ first.";
    });
  });

  section.querySelectorAll("[data-noop]").forEach(function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); });
  });
}


renderA("site");
wireDisclosures(document);
})();
</script>
