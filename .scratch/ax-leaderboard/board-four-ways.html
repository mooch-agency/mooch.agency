<title>The Board, Four Ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ============================================================================
   The Board, four ways. Iterations of Direction 1 for the mooch.agency AX
   leaderboard. Built on the live Mooch system: tokens.css, ui.css and motion.css
   are inlined here (an artifact is a single file) with the values unchanged, plus
   a dark palette the live site does not yet have.
   Data is the real 8 Sep 2026 scan. Nothing is invented.

   Fold revision, 9 Sep 2026. The ranking is the first thing under the lede, the
   toggle and the filter share one row above the table header, and the email form
   has moved off the top of the page and into the row you open. Every count in
   the copy is derived from the data array.

   Trim, 9 Sep 2026. Five elements removed on Tahi's picks: the method note block
   and its disclosure, the toggle caption, the table tie caption, the scanner name
   in the trust stamp, and the level name printed next to each score. The method
   facts still live in the footnotes and the level name is still spoken to screen
   readers. The shared .moretoggle / .morewrap disclosure stays: the deck's bets
   note is still built on it.
   ========================================================================== */

/* --- tokens.css, verbatim values -------------------------------------- */
:root {
  --black:#000000; --ink:#1d1d1f; --paper:#ffffff; --surface:#fbfbfd;
  --muted:#6e6e73; --muted-small:#5a5a5f;
  --hairline:#d2d2d7; --hairline-focus:#86868b;
  --error:#b00020; --success:#0a7d3f;
  --shadow-border:0 0 0 1px rgba(0,0,0,.06), 0 1px 2px -1px rgba(0,0,0,.06), 0 2px 4px 0 rgba(0,0,0,.04);
  --shadow-border-hover:0 0 0 1px rgba(0,0,0,.08), 0 1px 2px -1px rgba(0,0,0,.08), 0 2px 4px 0 rgba(0,0,0,.06);
  --serif:'Instrument Serif','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,"Liberation Mono",monospace;
  --pad-x:clamp(20px,5vw,56px);
  --max:1320px;
  --ease-decide:cubic-bezier(.16,1,.3,1);
  --ease-deliver:cubic-bezier(.2,0,0,1);
  --t-decide:1.56s; --t-deliver:.15s;
  --t-disclose:.34s;

  /* Board-specific, derived from the tokens above. Kept as tokens so the dark
     block only has to redefine values, never rules. */
  --board:#ffffff;
  --band:#f3f3f5;          /* band / group header ground */
  --pip-on:#1d1d1f;        /* a check that passed */
  --pip-off:#d2d2d7;       /* a check that did not */
  --pip-part:#86868b;      /* a group where some passed */
  --hi:rgba(217,119,87,.14); /* row highlight when you find your chain */
  --hi-edge:#d97757;        /* Claude orange, the one borrowed colour on the site */
}

/* Dark. Only token values change. --black flips to the light fill so ui.css's
   .pill (background:var(--black); color:var(--paper)) stays legible either way. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --black:#f2f2f4; --ink:#f2f2f4; --paper:#0b0b0c; --surface:#141416;
    --muted:#9a9aa1; --muted-small:#a9a9b0;
    --hairline:#2b2b2e; --hairline-focus:#5b5b61;
    --error:#ff8080; --success:#5cc98d;
    --shadow-border:0 0 0 1px rgba(255,255,255,.09);
    --shadow-border-hover:0 0 0 1px rgba(255,255,255,.16);
    --board:#0f0f11; --band:#191a1c;
    --pip-on:#f2f2f4; --pip-off:#3a3a3e; --pip-part:#7d7d84;
    --hi:rgba(217,119,87,.2);
  }
}
:root[data-theme="dark"] {
  --black:#f2f2f4; --ink:#f2f2f4; --paper:#0b0b0c; --surface:#141416;
  --muted:#9a9aa1; --muted-small:#a9a9b0;
  --hairline:#2b2b2e; --hairline-focus:#5b5b61;
  --error:#ff8080; --success:#5cc98d;
  --shadow-border:0 0 0 1px rgba(255,255,255,.09);
  --shadow-border-hover:0 0 0 1px rgba(255,255,255,.16);
  --board:#0f0f11; --band:#191a1c;
  --pip-on:#f2f2f4; --pip-off:#3a3a3e; --pip-part:#7d7d84;
  --hi:rgba(217,119,87,.2);
}

/* --- base -------------------------------------------------------------- */
*,*::before,*::after { box-sizing:border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden; /* nothing on this page may scroll the page sideways */
}
p { margin:0; }
a { color:inherit; }
/* .empty and td.detail set display, which out-ranks the UA sheet's [hidden]
   rule and left the "no match" block on screen at all times. */
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--hi-edge); outline-offset:2px; }
.sr {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* --- ui.css, verbatim -------------------------------------------------- */
.pill {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--black); color:var(--paper); padding:12px 20px;
  border-radius:980px; font-size:14px; font-weight:500; letter-spacing:-.005em;
  border:1px solid var(--black); cursor:pointer; font-family:inherit;
  transition:transform var(--t-deliver) var(--ease-deliver),
             background var(--t-deliver) var(--ease-deliver),
             opacity var(--t-deliver) var(--ease-deliver);
}
.pill:hover { background:var(--ink); transform:translateY(-1px); }
.pill:active { transform:scale(.96); }
.pill .arrow { transition:transform var(--t-deliver) var(--ease-deliver); }
.pill:hover .arrow { transform:translateX(3px); }
.ghost {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:transparent; color:var(--ink); padding:10px 16px; border-radius:980px;
  font-size:13px; font-weight:500; border:1px solid var(--hairline-focus);
  cursor:pointer; font-family:inherit;
  transition:border-color var(--t-deliver) var(--ease-deliver),
             color var(--t-deliver) var(--ease-deliver),
             transform var(--t-deliver) var(--ease-deliver);
}
.ghost:hover { border-color:var(--ink); }
.ghost:active { transform:scale(.96); }

/* --- motion.css, trimmed to what this page uses ------------------------ */
@media (prefers-reduced-motion:no-preference) { html { scroll-behavior:smooth; } }
.reveal { animation:reveal var(--t-decide) var(--ease-decide) both; }
@keyframes reveal {
  from { opacity:0; transform:translateY(10px); filter:blur(3px); }
  to   { opacity:1; transform:none; filter:none; }
}
@media (prefers-reduced-motion:reduce) {
  .reveal { animation:none; }
  * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
  /* The disclosure hides its content with a delayed visibility flip. Without
     this the content would stay unreadable for a third of a second after it
     has already finished opening. */
  .morewrap > .morein { transition-delay:0s !important; }
}

/* --- disclosure (shared) ------------------------------------------------ */
/* A button plus a 0fr/1fr grid. The button keeps real button semantics, so
   Enter and Space work without a keydown handler; the grid animates height
   without ever measuring anything, so the collapsed state cannot jump. */
.moretoggle {
  appearance:none; background:none; border:0; padding:9px 0; margin:0;
  font:inherit; font-size:13px; color:var(--ink); cursor:pointer;
  display:inline-flex; align-items:center; gap:8px; text-align:left;
  text-decoration:underline; text-underline-offset:4px;
  text-decoration-color:var(--hairline-focus);
  transition:text-decoration-color var(--t-deliver) var(--ease-deliver);
}
.moretoggle:hover { text-decoration-color:var(--ink); }
.moretoggle .chev {
  display:inline-block; font-family:var(--mono); color:var(--muted-small);
  transition:transform var(--t-deliver) var(--ease-deliver);
}
.moretoggle[aria-expanded="true"] .chev { transform:rotate(90deg); }
.morewrap {
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows var(--t-disclose) var(--ease-decide);
}
.morewrap[data-open="true"] { grid-template-rows:1fr; }
/* visibility, not just clipping: collapsed copy must leave the accessibility
   tree too, or a screen reader reads a note the eye cannot see. */
.morewrap > .morein {
  overflow:hidden; min-height:0; visibility:hidden;
  transition:visibility 0s linear var(--t-disclose);
}
.morewrap[data-open="true"] > .morein { visibility:visible; transition-delay:0s; }
.morein > * + * { margin-top:9px; }

/* --- page chrome (the design deck around the mocks) --------------------- */
.deck { max-width:var(--max); margin:0 auto; padding:30px var(--pad-x) 0; }
.deckhead { display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-start; justify-content:space-between; }
.eyebrow {
  font-family:var(--mono); font-size:11px; text-transform:uppercase;
  letter-spacing:.14em; color:var(--muted-small); margin:0;
}
.decktitle { font-family:var(--serif); font-size:clamp(26px,3.4vw,34px); line-height:1.05; margin:6px 0 0; font-weight:400; letter-spacing:-.01em; }
.decksub { color:var(--muted); max-width:96ch; margin-top:8px; font-size:13.5px; text-wrap:pretty; }

.switchrow {
  display:flex; gap:4px 20px; flex-wrap:wrap; align-items:flex-end;
  justify-content:space-between; margin-top:18px;
  border-bottom:1px solid var(--hairline);
}
.switch { display:flex; gap:6px; flex-wrap:wrap; }
.switch button {
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  font-family:inherit; font-size:14px; font-weight:500; color:var(--muted);
  padding:10px 14px; cursor:pointer; margin-bottom:-1px;
  transition:color var(--t-deliver) var(--ease-deliver), border-color var(--t-deliver) var(--ease-deliver);
}
.switch button:hover { color:var(--ink); }
.switch button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); }
.switch .num { font-family:var(--mono); font-size:11px; color:var(--muted-small); margin-right:7px; }

.deckmore { margin-top:0; }
.deckmore .moretoggle { padding:10px 0; }
.betnote { display:grid; gap:6px; max-width:96ch; font-size:13px; color:var(--muted); }
.betnote b { color:var(--ink); font-weight:600; }

/* --- the mock frame ----------------------------------------------------- */
.frame {
  margin:18px auto 0; border:1px solid var(--hairline); border-radius:14px;
  background:var(--board); overflow:hidden; box-shadow:var(--shadow-border);
}
.frametab {
  display:flex; justify-content:space-between; gap:12px; align-items:center;
  padding:9px 16px; border-bottom:1px solid var(--hairline); background:var(--surface);
  font-family:var(--mono); font-size:11px; color:var(--muted-small); letter-spacing:.06em;
}
.pad { padding:clamp(20px,2.6vw,32px); }

/* --- hero ---------------------------------------------------------------- */
.display {
  font-family:var(--serif); font-weight:400; letter-spacing:-.015em;
  font-size:clamp(28px,3.6vw,40px); line-height:1.04; margin:10px 0 0;
  text-wrap:balance; max-width:34ch;
}
.display em { font-style:italic; }
.lede { margin-top:12px; font-size:clamp(15px,1.3vw,16.5px); color:var(--ink); max-width:70ch; text-wrap:pretty; }

.morein p { font-size:13.5px; color:var(--muted); text-wrap:pretty; }
/* The trust stamp now lives at the foot of the page, alongside the notes. */
.stamp {
  margin:0; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--muted-small); display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center;
}
.stamp .dot { width:6px; height:6px; border-radius:50%; background:var(--success); display:inline-block; margin-right:6px; }

/* --- controls row: the toggle and the filter, directly above the header --- */
.controls {
  display:flex; gap:12px 20px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; margin-top:20px;
}
.ctrl-left { display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex:0 0 auto; margin-left:auto; min-width:0; }
.ctrl-left .eyebrow { flex:0 0 auto; }
.ctrlcap { margin-top:8px; font-size:12.5px; color:var(--muted); max-width:92ch; text-wrap:pretty; }
.ctrlcap .inlineview { font-size:12.5px; }

.seg {
  display:inline-flex; border:1px solid var(--hairline-focus); border-radius:980px;
  padding:3px; gap:2px; background:var(--paper);
}
.seg button {
  appearance:none; border:0; background:none; font-family:inherit; font-size:13px;
  font-weight:500; color:var(--muted); padding:8px 16px; border-radius:980px; cursor:pointer;
  transition:background var(--t-deliver) var(--ease-deliver), color var(--t-deliver) var(--ease-deliver);
}
.seg button:hover { color:var(--ink); }
.seg button:active { transform:scale(.96); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }

/* Iteration 03's toggle: two cards that explain themselves. Concentric radius:
   10px inner sits inside the 14px frame with room to spare. */
.tabs { display:flex; gap:10px; flex-wrap:wrap; flex:1 1 auto; min-width:0; }
.tabs button {
  flex:1 1 200px; text-align:left; appearance:none; cursor:pointer; font-family:inherit;
  background:var(--paper); border:1px solid var(--hairline); border-radius:10px; padding:9px 14px;
  transition:border-color var(--t-deliver) var(--ease-deliver), background var(--t-deliver) var(--ease-deliver);
}
.tabs button:hover { border-color:var(--hairline-focus); }
.tabs button[aria-pressed="true"] { border-color:var(--ink); background:var(--band); }
.tabs .tt { display:block; font-size:13.5px; font-weight:600; color:var(--ink); }
.tabs .td { display:block; font-size:12px; color:var(--muted); margin-top:2px; }

.inlineview { background:none; border:0; padding:0; font:inherit; color:var(--ink); cursor:pointer;
  text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--hairline-focus); }
.inlineview:hover { text-decoration-color:var(--ink); }

/* --- find your chain ----------------------------------------------------- */
.find { display:flex; gap:10px; align-items:center; flex:0 1 auto; min-width:0; }
.find input {
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
  border:1px solid var(--hairline-focus); border-radius:980px; padding:9px 16px;
  min-width:0; width:min(240px,52vw);
}
.find input::placeholder { color:var(--muted); }
.findnote { font-family:var(--mono); font-size:11px; color:var(--muted-small); letter-spacing:.06em; }

/* --- board table --------------------------------------------------------- */
.tablewrap { margin-top:14px; overflow-x:auto; border-top:1px solid var(--hairline); }
table.board { width:100%; border-collapse:collapse; font-size:14px; }
table.board th {
  text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.12em; color:var(--muted-small); font-weight:400;
  padding:12px 12px; border-bottom:1px solid var(--hairline); white-space:nowrap;
}
table.board td { padding:11px 12px; border-bottom:1px solid var(--hairline); vertical-align:middle; }
table.board tr.row { transition:background var(--t-deliver) var(--ease-deliver); }
table.board tr.row:hover { background:var(--surface); }
table.board tr.row.dim { opacity:.34; }
table.board tr.row.hit { background:var(--hi); box-shadow:inset 3px 0 0 var(--hi-edge); }
/* The whole row is the hit target. The chevron stays the real button, so the
   row keeps its table semantics and the control keeps its aria state; a click
   anywhere on the row is forwarded to it, and its focus ring is drawn on the
   whole row so keyboard and mouse land in the same place. */
table.board tr.row[data-open] { cursor:pointer; }
table.board tr.row:has(.opener:focus-visible),
table.board tr.row.kbd {
  outline:2px solid var(--hi-edge); outline-offset:-2px; background:var(--surface);
}
/* Only drop the chevron's own ring once the row is definitely showing one,
   so a browser that draws neither is impossible. */
table.board tr.row.kbd .opener:focus-visible { outline:none; }
.rank { font-family:var(--mono); font-size:13px; color:var(--muted-small); font-variant-numeric:tabular-nums; width:1%; white-space:nowrap; }
.rank.joint { color:var(--muted); }
.brand { font-weight:600; letter-spacing:-.01em; }
.brandurl { display:block; font-family:var(--mono); font-size:11px; color:var(--muted-small); margin-top:2px; }
.fnmark { font-size:10px; vertical-align:super; color:var(--hi-edge); margin-left:2px; font-family:var(--mono); }

/* score meter: five segments, one per level. The number is the value, the
   segments are only there so a tie is visible at a glance. */
.score { display:inline-flex; align-items:center; gap:9px; white-space:nowrap; }
.meter { display:inline-flex; gap:2px; }
.meter i { width:9px; height:16px; border-radius:2px; background:var(--pip-off); display:block; }
.meter i.on { background:var(--pip-on); }
.snum { font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; }

/* check pips (iteration 03). Read-only marks, not controls: the row is the
   control, and a button inside a clickable row is two hit areas fighting. */
.pips { display:inline-flex; gap:5px; }
.pips b { display:block; width:11px; height:11px; border-radius:3px; background:var(--pip-off); }
.pips b.on { background:var(--pip-on); }
.pips b.part { background:var(--pip-part); }

.plat { font-family:var(--mono); font-size:11.5px; color:var(--muted-small); white-space:nowrap; }
/* The 30D delta: a coloured triangle and a number once there is a second scan
   to diff against, a flat muted dash until then. */
.movecell { font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted-small); }
.movecell.up { color:var(--success); }
.movecell.down { color:var(--error); }
.fixcell { font-size:12.5px; color:var(--muted); max-width:38ch; }
.fixline { font-size:13px; color:var(--ink); margin-top:4px; }
.fixline b { font-weight:600; }
.fixtag {
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted-small); display:block; margin-bottom:2px;
}
.opener {
  appearance:none; background:none; border:1px solid var(--hairline); border-radius:7px;
  width:28px; height:28px; cursor:pointer; color:var(--muted); font-size:15px; line-height:1;
  display:grid; place-items:center; font-family:inherit; position:relative;
  transition:border-color var(--t-deliver) var(--ease-deliver), transform var(--t-deliver) var(--ease-deliver);
}
/* 28px is the visible size; the pseudo-element takes the hit area to 40x40. */
.opener::after { content:""; position:absolute; inset:-6px; }
.opener:hover { border-color:var(--ink); color:var(--ink); }
.opener[aria-expanded="true"] { transform:rotate(90deg); border-color:var(--ink); color:var(--ink); }
td.detail { background:var(--surface); padding:20px 12px 24px; }
td.detail > div { display:grid; gap:18px; }

/* --- checks in the expanded row ------------------------------------------ */
.checks { display:grid; gap:12px; }
.check { display:grid; grid-template-columns:20px 1fr; gap:10px; align-items:start; }
.mark { width:18px; height:18px; border-radius:5px; display:grid; place-items:center; font-size:11px; margin-top:1px; }
.mark.y { background:var(--success); color:var(--paper); }
.mark.n { background:var(--pip-off); color:var(--muted-small); }
.mark.p { background:var(--pip-part); color:var(--paper); }
.cname { font-weight:600; font-size:14px; display:block; }
.cwhat { font-size:13px; color:var(--muted); display:block; margin-top:2px; max-width:70ch; }
.cev { display:grid; gap:3px; margin-top:7px; }
.cev span { font-family:var(--mono); font-size:11px; color:var(--muted-small); }
.cev span::before { content:"\00b7"; margin-right:7px; color:var(--pip-off); }
.cev span.y::before { content:"+"; color:var(--success); }

/* --- CTA, which now lives only inside an opened row ----------------------- */
.cta { border:1px solid var(--hairline); border-radius:12px; padding:18px 20px; background:var(--paper); display:grid; gap:12px; }
.ctalabel { font-size:14px; font-weight:600; max-width:56ch; }
.ctasub { font-size:13px; color:var(--muted); max-width:64ch; margin-top:-6px; }
form.mail { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.mailfield {
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--paper);
  border:1px solid var(--hairline-focus); border-radius:10px;
  display:inline-flex; align-items:center; flex:1 1 200px; min-width:0; max-width:330px; padding:0 12px;
}
/* The input drops its own outline so the ring can sit on the whole field, which is
   what reads as one address. The ring has to be here or the primary CTA has no
   visible focus at all. */
.mailfield:focus-within { outline:2px solid var(--hi-edge); outline-offset:2px; }
.mailfield input {
  border:0; background:none; font-family:inherit; font-size:14px; color:var(--ink);
  padding:10px 0; min-width:40px; flex:1 1 auto; width:100%; outline:none;
}
.mailfield .at { font-family:var(--mono); font-size:13px; color:var(--muted-small); white-space:nowrap; }
.secondary { font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--hairline-focus); }
.secondary:hover { color:var(--ink); text-decoration-color:var(--ink); }
.said { font-size:13px; color:var(--success); }

/* --- the pitch under the board: one line, one link, no form --------------- */
.pitch { margin-top:20px; display:flex; gap:6px 18px; flex-wrap:wrap; align-items:baseline; }
.pitch p { font-size:13.5px; color:var(--ink); max-width:74ch; text-wrap:pretty; }

/* --- bands (iteration 2) --------------------------------------------------- */
.bandhead {
  display:flex; justify-content:space-between; gap:10px 20px; align-items:baseline; flex-wrap:wrap;
  padding:14px 12px; background:var(--band); border-bottom:1px solid var(--hairline);
}
.bandhead .bt { font-weight:600; font-size:14px; display:flex; align-items:center; gap:10px; }
.bandhead .bc { font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--muted-small); }
.bandhead .bd { font-size:12.5px; color:var(--muted); flex-basis:100%; max-width:70ch; }
.jumprow { display:flex; gap:8px 20px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-top:12px; }
.jumpcap { font-size:12.5px; color:var(--muted); text-wrap:pretty; }
.jump { display:flex; gap:6px; flex-wrap:wrap; }
.jump button {
  appearance:none; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  border:1px solid var(--hairline); background:var(--paper); color:var(--muted-small);
  border-radius:980px; padding:7px 12px; cursor:pointer;
  transition:border-color var(--t-deliver) var(--ease-deliver), color var(--t-deliver) var(--ease-deliver);
}
.jump button:hover { border-color:var(--ink); color:var(--ink); }
.jump button:active { transform:scale(.96); }

/* --- legend (iteration 3) --------------------------------------------------- */
.legend { display:flex; gap:10px 22px; flex-wrap:wrap; margin-top:10px; }
.legend div { display:flex; gap:7px; align-items:center; font-size:12.5px; color:var(--muted); }
.legend i { width:10px; height:10px; border-radius:3px; display:block; }

/* --- compare (iteration 4) --------------------------------------------------- */
.compare { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; }
.comparecol { border:1px solid var(--hairline); border-radius:10px; padding:16px; background:var(--paper); display:grid; gap:12px; }
.comparecol h4 { margin:0; font-size:13px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--muted-small); font-weight:400; }
.stickycta {
  position:sticky; bottom:0; z-index:5; margin:0 calc(-1 * clamp(20px,2.6vw,32px)) calc(-1 * clamp(20px,2.6vw,32px));
  padding:14px clamp(20px,2.6vw,32px); border-top:1px solid var(--hairline);
  background:var(--band); display:flex; gap:12px 18px; flex-wrap:wrap; align-items:center; justify-content:space-between;
}
.stickycta .sl { font-size:13.5px; font-weight:600; }

/* --- footnotes ------------------------------------------------------------- */
.foot { margin-top:26px; padding-top:20px; border-top:1px solid var(--hairline); display:grid; gap:12px; }
.foot p { font-size:12.5px; color:var(--muted); max-width:82ch; text-wrap:pretty; }
.foot b { color:var(--ink); font-weight:600; }
.foot ol { margin:0; padding-left:18px; display:grid; gap:8px; }
.foot li { font-size:12.5px; color:var(--muted); max-width:82ch; text-wrap:pretty; }
.empty { padding:26px 12px; font-size:14px; color:var(--muted); display:grid; gap:10px; justify-items:start; }

/* --- responsive ------------------------------------------------------------- */
/* A fact parked in an .opt column needs somewhere to go once that column is
   dropped. Two homes, one per shape of fact, and each renders only below 960px
   so nothing is on screen, or announced to a screen reader, twice.
   .onsm  a short fact tucked into the Chain cell (iteration 01's docs platform).
   tr.smrow  a full-width line under the row, for iteration 03, where a long fix
   in the Chain cell would widen that column and shove the check pips, the whole
   point of that iteration, off the side of a phone. */
.onsm { display:none; }
tr.smrow { display:none; }
tr.smrow td { padding-top:2px; }
/* The sub-row spans a table that is wider than the phone, so without a cap the
   fix would lay out across the full table and need a sideways scroll to read.
   Cap it to the viewport less the deck and frame padding, and it wraps inside
   the visible window instead. */
.smcell { display:grid; gap:7px; font-size:12.5px; color:var(--muted); max-width:calc(100vw - 92px); }
table.board tr.smrow.dim { opacity:.34; }
table.board tr.smrow.hit { background:var(--hi); box-shadow:inset 3px 0 0 var(--hi-edge); }
@media (max-width:960px) {
  .opt { display:none; }
  .onsm { display:block; margin-top:5px; }
  tr.smrow { display:table-row; }
  tr.row.hassm td { border-bottom:0; }
}
@media (max-width:720px) {
  .opt2 { display:none; }
  .pad { padding:20px; }
  table.board th, table.board td { padding:10px 8px; }
  .controls { align-items:stretch; }
  .find { flex:1 1 100%; }
  .find input { width:100%; }
  .stickycta { position:static; margin:20px -20px -20px; padding:14px 20px; }
}
@media (max-width:520px) {
  .meter i { width:7px; height:14px; }
  form.mail { flex-direction:column; align-items:stretch; }
  .mailfield { max-width:none; }
  .pill { width:100%; }
}

    ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getUTCMonth()] +
    " " + d.getUTCFullYear();
}
var SCAN_DATE = fmtDate(DATA.scannedAt);

/* Counts used in copy, computed from the data so the copy can never drift. */
function tally(view) {
  var t = {};
  ROWS.forEach(function (r) { var l = v(r, view).level; t[l] = (t[l] || 0) + 1; });
  return t;
}
function biggestTie(view) {
  var t = tally(view), best = { n: 0, lv: 0 };
  Object.keys(t).forEach(function (k) { if (t[k] > best.n) best = { n: t[k], lv: +k }; });
  return best;
}
/* Where that tie sits once the board is numbered, for the notes on iteration 01. */
function tieRange(view) {
  var big = biggestTie(view), from = 1;
  [5,4,3,2,1,0].forEach(function (lv) {
    if (lv > big.lv) from += (tally(view)[lv] || 0);
  });
  return { n: big.n, lv: big.lv, from: from, to: from + big.n - 1 };
}
/* The two rows furthest apart on their two doors, for iteration 04's lede. */
function widestGaps() {
  var by = ROWS.slice().sort(function (a, b) {
    return (b.docs.level - b.site.level) - (a.docs.level - a.site.level);
  });
  return { docsAhead: by[0], siteAhead: by[by.length - 1] };
}
function gapCount() {
  return ROWS.filter(function (r) { return Math.abs(r.site.level - r.docs.level) >= GAP; }).length;
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : (many || one + "s")); }

/* --- sorting and ranking ---------------------------------------------------- */
function sorted(view, mode) {
  var other = view === "site" ? "docs" : "site";
  return ROWS.slice().sort(function (a, b) {
    var d = v(b, view).level - v(a, view).level;
    if (d) return d;
    if (mode === "cross") {
      var e = v(b, other).level - v(a, other).level;
      if (e) return e;
    }
    return a.tvs - b.tvs;
  });
}
/* Joint rank: everyone on the same score shares the rank of the first of them. */
function jointRanks(list, view) {
  var out = [], seen = {};
  list.forEach(function (r, i) {
    var lv = v(r, view).level;
    if (!(lv in seen)) seen[lv] = i + 1;
    out.push({ n: seen[lv], joint: false });
  });
  var counts = {};
  list.forEach(function (r) { var lv = v(r, view).level; counts[lv] = (counts[lv] || 0) + 1; });
  list.forEach(function (r, i) { if (counts[v(r, view).level] > 1) out[i].joint = true; });
  return out;
}

/* --- evidence --------------------------------------------------------------- */
function groupMark(g) {
  if (g.passed === g.total) return '<span class="mark y" aria-hidden="true">&#10003;</span>';
  /* The en dash here is a glyph, not punctuation: it is the "none passed" mark,
     and it is hidden from screen readers, which get the count in words. */
  if (g.passed === 0) return '<span class="mark n" aria-hidden="true">&#8211;</span>';
  return '<span class="mark p" aria-hidden="true">&#189;</span>';
}
function checksHtml(view) {
  return '<div class="checks">' + view.groups.map(function (g) {
    return '<div class="check">' + groupMark(g) +
      '<span><span class="cname">' + esc(g.label) +
        '<span class="sr">: ' + g.passed + " of " + g.total + " passed</span></span>" +
        '<span class="cwhat">' + esc(groupCopy(g)) + "</span>" +
        '<span class="cev">' + g.items.map(function (it) {
          return '<span class="' + (it.s === "pass" ? "y" : "") + '">' +
            esc(CHECK_NAME[it.k]) + ": " + esc(it.m) + "</span>";
        }).join("") + "</span></span></div>";
  }).join("") + "</div>";
}
function fixHtml(view, name, which) {
  if (!view.next) {
    return '<p class="fixline"><span class="fixtag">Top of the board</span>' +
      esc(name) + " passes everything Cloudflare scores. The " + which +
      " has nowhere left to climb.</p>";
  }
  return '<p class="fixline"><span class="fixtag">Room to climb</span>' +
    "The full report names the exact fix and the level it unlocks.</p>";
}
/* The short form of fixHtml for a table cell, where a full paragraph does not
   fit. Never names the actual check, same as fixHtml: that is the report's job. */
function fixTeaseShort(view) {
  return view.next ? "Room to climb, see the report." : "Nowhere left to climb.";
}
/* No history yet: one scan exists, so 30D is a placeholder until a second
   scan lands. The component supports up/down (green triangle, red triangle,
   the delta) for when it does; today every row renders the flat, muted dash.
   The dash is decorative; the sr text carries the actual state so it does not
   read as a broken cell to a screen reader. */
function moveCell(cls) {

    '<span class="sr">No history yet</span></td>';
}

/* --- the CTA, which now only ever appears inside an opened row -------------- */
var seq = 0;
function ctaForm(opts) {

}
function rowCta(name, domain, which) {

function pitch() {

function footnotes(view, extra) {
  var t3 = tally("docs")[3] || 0;
  var plat3 = {};

  /* Which scores nobody reached, said by looking rather than by remembering. */
  var seen = {};
  ROWS.forEach(function (r) { seen[r.site.level] = 1; seen[r.docs.level] = 1; });
  var missing = [0,1,2,3,4,5].filter(function (lv) { return !seen[lv]; });

    "<b>The docs platform does a lot of the work.</b> All " + plural(t3, "chain") +

      ", which ships Content Signals and a Markdown version by default. Nobody configured it. " +
      "We put the platform on the row rather than hide it.",
    "<b>Two families of checks run but never count.</b> Web Bot Auth came back neutral on all " +
      SITES + " sites, and Cloudflare does not score the " + payN +
      " agent-payment checks at all. Nothing passed those on any site here, so there is no " +
      "payment row on this board.",
    "<b>The scores are Cloudflare\u2019s, unaltered.</b> " + scale + "." +
      (missing.length

    "</tbody></table></div>" +
    '<div class="empty" data-role="empty" hidden><p>No chain on the board matches that.</p><a class="secondary" href="#" data-noop>Your L2 missing? Let us know.</a></div>' +
    pitch() +
    footnotes(view) + "</div>";
  wire(s, "c", view);
}

/* ===========================================================================
   Iteration 04, Both Doors.
   Bets: both scores on every row, all the time; the toggle is a "rank by"
   control, so switching re-sorts rather than replacing the board; ties break
   on the other door's score first; the row opens into a side by side
   comparison; the CTA follows you in a bar that adopts the last row you opened.
   ========================================================================= */
function renderD(view) {
  var s = document.getElementById("p-d");
  var vc = VIEW_COPY[view];
  var list = sorted(view, "cross");

    }) +

    }) +

        '<td style="' + (lead === "site" ? "" : "opacity:.62") + '">' + score(r.site.level) +

            return '<div class="comparecol"><h4>' + VIEW_COPY[k].label + " &middot; " + esc(vw.url) + "</h4>" +

/* --- wiring ------------------------------------------------------------------ */
var RENDER = { a: renderA, b: renderB, c: renderC, d: renderD };

/* A row is not always followed straight away by its detail row: iteration 03
   slips a mobile-only .smrow in between. Walk to the detail row rather than
   assuming it is the next sibling. */
function detailOf(tr) {
  var n = tr.nextElementSibling;
  while (n && !n.classList.contains("detailrow")) n = n.nextElementSibling;
  return n;
}

/* Disclosures: one button, one 0fr/1fr grid, wired once wherever they appear. */
function wireDisclosures(root) {
  root.querySelectorAll(".moretoggle").forEach(function (b) {
    if (b.dataset.wired) return;
    b.dataset.wired = "1";
    b.addEventListener("click", function () {
      var w = document.getElementById(b.getAttribute("aria-controls"));
      if (!w) return;
      var open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!open));
      w.dataset.open = String(!open);
    });
  });
}

function wire(section, key, view) {
  wireDisclosures(section);

  /* view switches */
  section.querySelectorAll("[data-view]").forEach(function (b) {
    b.addEventListener("click", function () { RENDER[key](b.dataset.view); });
  });

  /* rows that open. The chevron is the control; the row forwards to it. */
  section.querySelectorAll(".opener").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var tr = btn.closest("tr"), det = detailOf(tr);
      var open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      det.hidden = open;
      if (!open) adoptSticky(section, tr);
    });
  });
  section.querySelectorAll("tr.row[data-open]").forEach(function (tr) {
    var btn = tr.querySelector(".opener");
    if (!btn) return;
    /* The ring belongs on the row, because the row is the hit target. :has()
       does the work where it can; this mirrors it so the ring never goes
       missing, and :focus-visible keeps it off after a mouse click. */
    btn.addEventListener("focus", function () {
      if (btn.matches(":focus-visible")) tr.classList.add("kbd");
    });
    btn.addEventListener("blur", function () { tr.classList.remove("kbd"); });
    tr.addEventListener("click", function (e) {
      /* Let real controls and links inside the row win, and never fire when the
         click was the end of a text selection. */
      if (e.target.closest("a,button,input,select,label")) return;
      var sel = window.getSelection && window.getSelection().toString();
      if (sel) return;
      btn.click();
    });
  });

  /* band jump chips */
  section.querySelectorAll("[data-jump]").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = section.querySelector("#" + b.dataset.jump);
      if (t) t.scrollIntoView({ block: "center" });
    });
  });

  /* find your chain: highlight and dim, never hide, so your neighbours stay
     on screen. That is the whole point of a leaderboard. */
  var find = section.querySelector("[data-role=find]");
  if (find) {
    var note = section.querySelector("[data-role=findnote]");
    var empty = section.querySelector("[data-role=empty]");
    find.addEventListener("input", function () {
      var q = find.value.trim().toLowerCase(), n = 0;
      section.querySelectorAll("tr.row").forEach(function (tr) {
        var hit = q && tr.dataset.name.indexOf(q) !== -1;
        tr.classList.toggle("hit", !!hit);
        tr.classList.toggle("dim", !!q && !hit);
        /* The mobile-only sub-row is part of its chain's row, so it highlights
           and dims with it rather than sitting bright under a dimmed row. */
        var sm = tr.nextElementSibling;
        if (sm && sm.classList.contains("smrow")) {
          sm.classList.toggle("hit", !!hit);
          sm.classList.toggle("dim", !!q && !hit);
        }
        if (hit) n++;
      });
      /* Empty when nothing is typed: the total is already stated in the lede,
         and repeating it here is the third place the board says the same number. */
      note.textContent = !q ? "" : plural(n, "match", "matches");
      empty.hidden = !(q && n === 0);
      if (q && n === 1) {
        var f = section.querySelector("tr.row.hit");
        if (f) f.scrollIntoView({ block: "center" });
      }
    });
  }

  /* CTA forms. This is a mockup, so it says so rather than pretending. */
  section.querySelectorAll("form.mail").forEach(function (f) {
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var said = f.querySelector("[data-role=said]");
      var local = f.querySelector("input").value.trim();
      said.textContent = local
        ? "Mockup, so nothing was sent. On the live board this starts the fix and re-scan."
        : "Add the bit before the @ first.";
    });
  });

  section.querySelectorAll("[data-noop]").forEach(function (a) {
    a.addEventListener("click", function (e) { e.preventDefault(); });
  });
}

/* the sticky bar in iteration 04 adopts whichever row you last opened */
function adoptSticky(section, tr) {
  var bar = section.querySelector(".stickycta");
  if (!bar || !tr.dataset.domain) return;
  bar.querySelector("[data-role=stickylabel]").textContent =
    "Get " + tr.dataset.brand + "\u2019s full report.";
  bar.querySelector("[data-role=at]").textContent = "@" + tr.dataset.domain;
}

/* --- the design deck's own copy, also derived from the data ------------------- */
document.getElementById("decksub").textContent =
  "Four iterations of Direction 1, on the real " + SCAN_DATE + " scan of L2Beat\u2019s top " + N +
  " rollups. Each one changes a different bet: the default view, how ties are handled, how the " +
  "evidence and the one fix are disclosed, and where the CTA sits.";

var tieA = tieRange("docs"), tieB = biggestTie("site");
var BETS = {
  a: ["<b>Bets:</b> docs is the default view, because it is the only one with any spread. Ties are numbered 1 to " + N +
      " and broken on L2Beat value secured, stated in the board\u2019s caption. Evidence, the one fix and the email field sit behind a row that opens, and the whole row opens it.",
      "<b>Costs:</b> numbering a " + tieA.n + "-way tie " + tieA.from + " to " + tieA.to +
      " implies a difference the scan did not find, and a foundation ranked at the bottom of a tied block can fairly call it arbitrary. Nothing but the score is visible until you open a row."],
  b: ["<b>Bets:</b> the website is the default, because that is where the problem is. The toggle is a sentence you read, not a control you have to spot. No rank numbers at all: chains group into score bands with the count on the band. The one fix is on every row without a click.",
      "<b>Costs:</b> a decision-maker who came to see their position gets no position, and no screenshot with a number one in it. Empty bands take vertical space to make a point."],
  c: ["<b>Bets:</b> every row carries its " + GROUPS + " check pips, its score and its one fix on the surface, so the board answers most of the question without a click. Ties carry a joint rank, so the tie is the headline fact rather than a footnote. The toggle is two cards that explain themselves.",
      "<b>Costs:</b> the widest row of the four, so the small screen loses the most. Giving the summary away free weakens the reason to open a row, which is where the business case sits."],
  d: ["<b>Bets:</b> both scores on every row at all times, so the toggle only changes the sort and you never lose the other door. Ties break on the other door\u2019s score first, then value secured, both published numbers. Rows open into a side by side comparison. The CTA also follows you in a bar that adopts the last row you opened.",
      "<b>Costs:</b> two scores per row is the densest thing here and the hardest to skim in ten seconds. The gap story is a great hook and a poor ranking: it rewards being uneven. The sticky bar is the one place a form sits outside an opened row."]
};
var TABS = ["a","b","c","d"];
var tabEls = TABS.map(function (k) { return document.getElementById("tab-" + k); });

function show(key) {
  TABS.forEach(function (k) {
    var sel = k === key;
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(sel));
    document.getElementById("p-" + k).hidden = !sel;
  });
  document.getElementById("betnote-in").innerHTML =
    BETS[key].map(function (p) { return "<p>" + p + "</p>"; }).join("");
}
tabEls.forEach(function (el, i) {
  el.addEventListener("click", function () { show(TABS[i]); });
  el.addEventListener("keydown", function (e) {
    var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    var n = (i + d + TABS.length) % TABS.length;
    tabEls[n].focus(); show(TABS[n]);
  });
});

/* Defaults are themselves a bet: 01 and 03 open on docs, 02 and 04 on the website. */
renderA("docs");
renderB("site");
renderC("docs");
renderD("site");
wireDisclosures(document);
show("a");
})();
</script>
