name: CI

# Deterministic, scriptable pre-launch gate for mooch.agency. This replaces the
# manually-run pre-launch-website-check skill with checks every PR must pass.
#
# Jobs:
#   fast         HTML validation + internal/sitemap link check + scripts/check-site.mjs
#   security     secret scanning (gitleaks CLI) + pnpm audit   (runs in parallel with fast)
#   audit-tests  audit/ unit tests                             (runs in parallel with fast)
#   a11y-perf    axe-core + Lighthouse CI budgets              (runs after fast)
#   ci-required  umbrella check that gates on all four         (make THIS the required check)
#
# Note: audit-batch.yml is a separate, unrelated pipeline — do not fold this into it.

on:
  pull_request:
    # No paths filter, on purpose (dropped 8 Nov 2026, resolving the old
    # "DECISION NEEDED" block that lived here). The workflow now runs on every
    # PR so ci-required, the single required check in branch protection,
    # always posts a status. With a filter, a PR touching no matching path
    # (docs-only, say) skipped the whole workflow and a required check waited
    # on it forever. The cheap jobs (fast, security, audit-tests) simply run;
    # the expensive browser job (a11y-perf) gates itself in-job on what the
    # PR actually changed.

# Check-only: this workflow never writes to the repo.
permissions:
  contents: read

# Supersede in-flight runs for the same ref when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # fast — deterministic markup, link and site checks. Sub-minute, blocks the PR.
  # ---------------------------------------------------------------------------
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. Valid HTML across the shipped site (non-shipped pages are skipped via
      #    .htmlvalidateignore, which mirrors check-site.mjs's exclusion list).
      - name: Validate HTML
        run: pnpm run ci:validate-html

      # 2. Broken internal + sitemap links. Two deliberate scoping decisions:
      #
      #    (a) Input is the shipped-page set, derived from the SAME source of truth
      #        as the checker (`check-site.mjs --list-pages`). Globbing "*.html"
      #        would drag in case-study-template.html / prompt-template.html, whose
      #        intentional placeholder links (/work/[next-slug]) don't exist and
      #        would fail the job. Deriving the list here keeps lychee and the
      #        checker locked to the same pages with no second exclusion list.
      #
      #    (b) No --include-fragments. lychee resolves a root-relative link like
      #        `/#work` to the root DIRECTORY, then can't find the `#work` id in a
      #        directory, so it errors on every clean page. Fragment resolution is
      #        instead done deterministically in check-site.mjs (Fragments
      #        discipline), which we control. lychee here checks link EXISTENCE
      #        only. Offline mode keeps it to internal links (no external hosts).
      #        --fallback-extensions html mirrors Vercel cleanUrls (/gov-uk -> gov-uk.html).
      #        --exclude '/api/' skips links to serverless functions (the Credit
      #        Cards portal and subscribe links): they exist only at runtime as
      #        api/*.js, so a file check can never resolve them.
      - name: Enumerate shipped pages (single source of truth for lychee)
        id: shipped
        run: echo "files=$(node scripts/check-site.mjs --list-pages | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Check internal links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --fallback-extensions html
            --exclude '/api/'
            --root-dir ${{ github.workspace }}
            --no-progress
            ${{ steps.shipped.outputs.files }} sitemap.xml
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. The 10-discipline site checks (SEO, content hygiene, tokens, social
      #    cards, index hygiene, uniqueness). Exits non-zero with file+line.
      - name: Run site checks
        run: pnpm run ci:check

      # 4. Root unit tests (scripts/*.test.mjs). Until Nov 2026 these ran
      #    nowhere but by hand: only audit/'s own suite ran in CI.
      - name: Run unit tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # security — secret scanning + dependency audit. Parallel with `fast`.
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # License-free secret scan. gitleaks-action@v2 requires a GITLEAKS_LICENSE
      # for PRIVATE org repos (the action refuses to run without one); the gitleaks
      # CLI has no such gate. We download a pinned release binary and scan the
      # checked-out tree with `gitleaks dir`. The version is pinned deliberately
      # (don't float to latest) for reproducible scans — bump it consciously.
      # `dir` scans files on disk, so no git history / fetch-depth:0 is needed.
      # gitleaks exits non-zero when it finds a secret, which fails this job.
      - name: Scan for secrets (gitleaks CLI, license-free)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --verbose

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # audit-tests — unit tests for the audit runtime. Parallel with `fast`.
  #
  # audit/ has its OWN package.json and lockfile (puppeteer-core + the Anthropic
  # SDK), separate from the site's, so this installs in that directory rather than
  # reusing the root install. The tests are deliberately browser-free and
  # network-free (that's why discovery.mjs and page-fallback.mjs were extracted
  # from run-pipeline.mjs), so this needs no Chrome and no API key and stays
  # sub-minute. The live regression traps are NOT run here: they cost real LLM
  # calls against real sites, so they stay a manual pre-merge step (audit/RUNNER.md).
  # ---------------------------------------------------------------------------
  audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: audit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Run audit unit tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # a11y-perf — heavier browser-driven checks. Runs only after `fast` passes,
  # scoped to the pages changed in the PR to keep runtime down.
  # ---------------------------------------------------------------------------
  a11y-perf:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the PR base

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Changed shipped pages -> URLs. A PR that changes no shipped page falls
      # back to the homepage when it touches something rendering-relevant
      # (stylesheets, root scripts, serving or budget config), and otherwise
      # skips the browser work entirely: since the workflow runs on every PR
      # (no paths filter), a docs- or scripts-only PR should cost no Chrome
      # minutes. Skipped steps still leave the job green, which ci-required
      # counts as a pass.
      # Untrusted input (base_ref, PR filenames) is passed via env and each slug
      # is charset-sanitised, so nothing attacker-controlled reaches the shell.
      - name: Determine changed pages
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          # --diff-filter=d: a page this PR deletes has nothing left to test (it would 404).
          mapfile -t files < <(git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD -- '*.html' 'prompts/*.html' || true)
          urls=""
          for f in "${files[@]}"; do
            [ -z "$f" ] && continue
            case "$f" in *-template.html|stagger-tuner.html|styleguide.html|portfolio-*.html|404.html|ready.html) continue;; esac
            slug="${f%.html}"; [ "$slug" = "index" ] && slug=""
            # Only allow a safe URL-path charset; skip anything else outright.
            case "$slug" in *[!a-zA-Z0-9/_-]*) echo "skip unsafe filename: $f"; continue;; esac
            urls="$urls http://localhost:3000/$slug"
          done
          # Rendering-relevant non-page changes: any stylesheet, a root script
          # (:(glob) keeps * from crossing /, so api/ and scripts/ stay out),
          # or the serving and budget config.
          cfg=$(git diff --name-only --diff-filter=d "origin/$BASE_REF"...HEAD -- '*.css' ':(glob)*.js' 'vercel.json' 'lighthouserc.json' || true)
          if [ -n "$(echo "$urls" | tr -d ' ')" ]; then
            run=true
          elif [ -n "$cfg" ]; then
            urls="http://localhost:3000/"
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "urls=$(echo "$urls" | xargs)" >> "$GITHUB_OUTPUT"
          echo "run=$run urls=${urls:-none}"

      # Serve the static site the way Vercel does (clean URLs). Backgrounded so
      # it stays up for the axe and Lighthouse steps that follow.
      - name: Serve static site
        if: steps.changed.outputs.run == 'true'
        run: |
          pnpm dlx serve@14 -l 3000 . > /tmp/serve.log 2>&1 &
          pnpm dlx wait-on@7 http://localhost:3000 --timeout 30000

      - name: Accessibility (axe-core)
        if: steps.changed.outputs.run == 'true'
        env:
          URLS: ${{ steps.changed.outputs.urls }}
        run: |
          # Use the runner's preinstalled, version-matched Chrome + ChromeDriver.
          # $CHROMEWEBDRIVER is provided by the GitHub-hosted image and always
          # matches the preinstalled google-chrome, sidestepping the version skew
          # from @axe-core/cli pulling its own floating chromedriver.
          #
          # force-prefers-reduced-motion: the site's .reveal entrance animation
          # starts elements at opacity:0 and fades them in with staggered delays.
          # Without this, axe samples mid-animation and reports false colour-contrast
          # failures on partially-transparent text (e.g. a #000 h1 reads as grey).
          # The site honours prefers-reduced-motion by rendering content at full
          # opacity immediately, so this measures the settled page.
          for u in $URLS; do
            echo "axe: $u"
            pnpm dlx --package=@axe-core/cli@4.12.1 axe "$u" \
              --chromedriver-path "$CHROMEWEBDRIVER/chromedriver" \
              --chrome-options="headless,no-sandbox,disable-gpu,force-prefers-reduced-motion" \
              --exit
          done

      - name: Performance budgets (Lighthouse CI)
        if: steps.changed.outputs.run == 'true'
        env:
          URLS: ${{ steps.changed.outputs.urls }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          urlflags=""
          for u in $URLS; do urlflags="$urlflags --collect.url=$u"; done
          pnpm dlx @lhci/cli@0.14.x autorun $urlflags

  # ---------------------------------------------------------------------------
  # ci-required — single umbrella status check. Make THIS the one required check
  # in branch protection instead of fast/security/audit-tests/a11y-perf individually. It runs
  # regardless of the others' outcome (if: always()) and fails if any of them
  # failed or was cancelled; jobs that were SKIPPED (e.g. a11y-perf when fast
  # failed) don't fail it on their own — fast's failure already does. This makes
  # the required check deterministic. The on-level paths filter was dropped on
  # 8 Nov 2026, so the workflow (this job included) runs and posts a status on
  # every PR.
  # ---------------------------------------------------------------------------
  ci-required:
    needs: [fast, security, audit-tests, a11y-perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast, security, audit-tests and a11y-perf to have passed
        env:
          FAST: ${{ needs.fast.result }}
          SECURITY: ${{ needs.security.result }}
          AUDIT_TESTS: ${{ needs.audit-tests.result }}
          A11Y_PERF: ${{ needs.a11y-perf.result }}
        run: |
          echo "fast=$FAST security=$SECURITY audit-tests=$AUDIT_TESTS a11y-perf=$A11Y_PERF"
          for r in "$FAST" "$SECURITY" "$AUDIT_TESTS" "$A11Y_PERF"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
