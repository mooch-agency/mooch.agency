# Audit batch runner (story 16, R2). Manual trigger: Actions -> "Audit batch"
# -> Run workflow. Processes the Inbound Audit Leads DB in two halves:
#   Approved -> run audit -> PDF attached to the row -> Ready for review
#   Send     -> report emailed via Resend (cc hey@) -> Sent
# Human flips stay in Notion; this only processes rows a human moved.
# Secrets: NOTION_TOKEN, ANTHROPIC_API_KEY, RESEND_API_KEY.

name: Audit batch

on:
  workflow_dispatch:
    inputs:
      pin_pages:
        description: 'AUDIT_PIN_PAGES override: comma-separated paths/URLs to read instead of letting the picker choose. Leave empty for normal behaviour. Ignored when method=websearch, which picks its own pages.'
        required: false
        default: ''
      method:
        description: 'Audit engine. pipeline = picker + prefetch + judge (incumbent). websearch = search for pages, read them rendered, gate after (31 Jul benchmark: 8 critical/high vs 0, reported on 6 of 6 sites vs 3 of 6).'
        required: false
        default: pipeline
        type: choice
        options: [pipeline, websearch]

concurrency:
  group: audit-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    # 45, not 30. The shared capture routine now scrolls slowly enough for
    # IntersectionObserver content to fire and then waits for the text to settle,
    # so a page read costs seconds rather than milliseconds. A batch of several
    # leads was already close to the old ceiling; being killed mid-batch leaves
    # rows half-processed with no signal about which ones ran.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: audit/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # puppeteer-core needs a real Chrome; the pipeline + PDF both use it.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run batch
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          AUDIT_LLM: api
          AUDIT_METHOD: ${{ inputs.method }}
          AUDIT_PIN_PAGES: ${{ inputs.pin_pages }}
        run: node scripts/batch.mjs

      # The judge's verbatim reasoning is written to the runner's disk, which dies
      # with the container. Successful runs copy it onto the Notion row, but a run
      # that aborts before that (JUDGE_UNPARSEABLE, a crash) has no row to write
      # to, so keep the file here too. `always()` is the point: the failed runs are
      # the ones worth reading.
      - name: Keep the judge's raw reasoning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-raw
          path: |
            audit/scripts/runs/*.judge-raw.txt
            audit/scripts/runs/*.audit-raw.txt
          retention-days: 30
          if-no-files-found: ignore
