<meta charset="utf-8">
<title>FRWA Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Archivo+Narrow:wght@600;700&display=swap">

<style>
  :root {
    /* Chassis: mooch's black, not phosphor-black. Amber survives as the one
       signal colour (see below), the way say-less.html reserves Claude's
       orange for exactly one job and nothing else. */
    --bg: #000000;
    --amber: #FFB000;
    --brt: #F2F1EC;     /* general emphasis text — off-white, not amber-tinted */
    --dim: #7A7A7F;     /* secondary/label text — neutral grey */
    --dimmer: #48484C;  /* placeholder / lowest-emphasis text */
    --rule: #2A2A2C;    /* hairline borders */
    --rule-soft: #1C1C1E;
    --sel: rgba(255, 176, 0, 0.10);  /* selection wash, not a solid fill */
    --text: #C7C7CC;    /* base body text — neutral, amber reserved for signal */

    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --doc: 'Courier Prime', 'Courier New', Courier, monospace;
    --stampface: 'Archivo Narrow', 'Arial Narrow', sans-serif;
    --serif: 'Instrument Serif', 'Times New Roman', serif;

    --glow: 0 0 7px rgba(255, 176, 0, 0.32);
    --ease-decide: cubic-bezier(0.16, 1, 0.3, 1);

    --paper: #FCFBF7;
    --ink: #12110E;
    --faint: #6E6B62;
    --prule: #C9C6BC;
    --stamp: #A8232B;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 0.045em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--amber); }
  .neg { color: var(--dim); }
  .lbl { color: var(--dim); }
  .grey { color: var(--dim); }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    animation: settle 640ms var(--ease-decide) 1;
  }

  /* No CRT flash-on, no scanlines: this is the mooch chassis, not the tube.
     A quiet settle, matching the "decide slow, deliver fast" reveal used
     across mooch.agency rather than a phosphor warm-up. */
  @keyframes settle {
    from { opacity: 0; filter: blur(4px); transform: translateY(6px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }

  /* ---------- top chrome ---------- */

  .topbar {
    flex: none;
    border-bottom: 1px solid var(--rule);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
    flex-wrap: wrap;
  }

  .mark { font-weight: 700; letter-spacing: 0.22em; color: var(--brt); font-size: 13.5px; }

  .composite { font-size: 12.5px; display: flex; align-items: baseline; gap: 8px; }
  .composite b { color: var(--amber); font-weight: 600; font-size: 15px; }

  .sess { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }

  .live {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px rgba(255, 176, 0, 0.7);
    display: block;
    animation: blip 2.6s ease-in-out infinite;
  }

  @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ---------- panel grid ---------- */

  .grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1.32fr 1fr;
    grid-template-rows: 1.25fr 1fr;
    min-height: 0;
  }

  .panel { border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .panel.tl { border-left: 0; border-top: 0; }
  .panel.tr { border-right: 0; border-top: 0; }
  .panel.bl { border-left: 0; border-bottom: 0; }
  .panel.br { border-right: 0; border-bottom: 0; }

  .bar {
    flex: none;
    background: transparent;
    color: var(--dim);
    border-bottom: 1px solid var(--rule);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    padding: 6px 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .bar button {
    font: inherit;
    letter-spacing: 0.14em;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--rule);
    padding: 3px 8px;
    margin: -3px 0;
    cursor: pointer;
    transition-property: background-color, color, border-color, transform;
    transition-duration: 120ms;
    position: relative;
  }

  /* Extend the hit target past the visible chip. */
  .bar button::after { content: ''; position: absolute; inset: -8px; }

  .bar button:hover { color: var(--brt); border-color: var(--hairline-focus, var(--dim)); }
  .bar button:active { transform: scale(0.96); }
  .bar button:focus-visible { outline: 1px solid var(--brt); outline-offset: 1px; }

  .body-pad { flex: 1 1 auto; padding: 9px 12px; overflow-y: auto; overflow-x: hidden; min-height: 0; }

  /* Phosphor scrollbars. */
  .body-pad::-webkit-scrollbar, .filing::-webkit-scrollbar { width: 8px; }
  .body-pad::-webkit-scrollbar-thumb { background: var(--rule); }
  .body-pad::-webkit-scrollbar-track { background: transparent; }

  /* ---------- register ---------- */

  .cols { display: grid; grid-template-columns: 64px minmax(0, 1.9fr) 1fr 1fr 0.9fr; }

  .head-row {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.1em;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--rule);
  }

  .sector-row { padding: 10px 0 3px; }
  .sector-row .lbl { letter-spacing: 0.14em; font-size: 11.5px; }

  .reg-row {
    padding: 4px 0;
    cursor: pointer;
    border: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    text-shadow: inherit;
    text-align: left;
    width: 100%;
    transition-property: background-color, color;
    transition-duration: 100ms;
  }

  .reg-row:hover { background: var(--rule-soft); }

  /* Selection is a signal, not a wash: amber marks only the symbol and a
     faint tint, everything else in the row just brightens to full ink. */
  .reg-row.on { background: var(--sel); color: var(--brt); }
  .reg-row.on .sym { color: var(--amber); }
  .reg-row:focus-visible { outline: 1px solid var(--brt); outline-offset: -1px; }

  .sym { color: var(--text); font-weight: 600; }
  .r { text-align: right; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }

  /* ---------- description ---------- */

  .d-hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .d-name {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(20px, 2.6vw, 27px); line-height: 1; color: var(--brt);
  }
  .d-ticker { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }

  .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 3px 10px; }
  .kv > span:nth-child(even) { color: var(--brt); }

  .thesis {
    border-top: 1px solid var(--rule-soft);
    margin-top: 8px;
    padding-top: 8px;
    color: var(--text);
    font-size: 12.5px;
    line-height: 1.62;
    text-wrap: pretty;
  }

  .cov {
    border-top: 1px solid var(--rule-soft);
    margin-top: 9px;
    padding-top: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 52px;
    gap: 4px 8px;
    font-size: 12.5px;
  }

  .cov .who { color: var(--brt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cov .pos { color: var(--brt); }
  .cov .neg { color: var(--dim); }
  .cov .grey { color: var(--dim); }

  /* ---------- wire ---------- */

  .wire { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 5px 10px; font-size: 12.5px; line-height: 1.55; }
  .wire .t { color: var(--dim); }

  /* ---------- chart ---------- */

  .chart-wrap { position: relative; height: 100%; min-height: 150px; display: flex; }
  #chart { flex: 1 1 auto; min-width: 0; height: 100%; }
  .chart { display: block; width: 100%; height: 100%; }

  .readout {
    position: absolute;
    top: 2px; left: 2px;
    font-size: 11px;
    color: var(--dim);
    pointer-events: none;
    background: rgba(10, 8, 6, 0.85);
    padding: 1px 6px;
  }
  .readout b { color: var(--brt); font-weight: 500; }

  /* ---------- command line ---------- */

  .cmdline {
    flex: none;
    border-top: 1px solid var(--rule);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
  }

  .cmdline label { color: var(--brt); font-size: 12.5px; font-weight: 600; flex: none; cursor: text; }

  .cmdline input {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: 0;
    color: var(--brt);
    font: inherit;
    letter-spacing: inherit;
    font-size: 12.5px;
    padding: 4px 0;
    caret-color: var(--amber);
    text-shadow: var(--glow);
  }

  .cmdline input:focus { outline: none; }
  .cmdline input::placeholder { color: var(--dimmer); text-shadow: none; }

  .cmdmsg { flex: none; color: var(--dim); font-size: 12px; }

  .fkeys {
    flex: none;
    border-top: 1px solid var(--rule);
    padding: 6px 14px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 16px;
  }

  .fkeys span { font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
  .fkeys b { color: var(--bg); background: var(--dim); text-shadow: none; padding: 0 4px; margin-right: 5px; font-weight: 700; }

  /* ---------- filing overlay: paper, the one non-phosphor object ---------- */

  .filing {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #241C0E;
    overflow-y: auto;
    display: none;
  }

  .filing.on { display: block; animation: sheetin 260ms cubic-bezier(0.2, 0, 0, 1) 1; }

  @keyframes sheetin {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .filing-close {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    padding: 6px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  .filing-close span { color: var(--dim); font-size: 11.5px; letter-spacing: 0.08em; }

  .filing-close button {
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.14em;
    background: var(--brt);
    color: var(--bg);
    border: 0;
    padding: 5px 12px;
    cursor: pointer;
    font-weight: 700;
    transition-property: background-color, transform;
    transition-duration: 120ms;
    position: relative;
  }

  .filing-close button::after { content: ''; position: absolute; inset: -6px; }
  .filing-close button:hover { background: #fff; }
  .filing-close button:active { transform: scale(0.96); }
  .filing-close button:focus-visible { outline: 1px solid var(--brt); outline-offset: 2px; }

  .sheet {
    max-width: 880px;
    margin: 0 auto;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--doc);
    font-size: 14.5px;
    line-height: 1.75;
    letter-spacing: 0;
    text-shadow: none;
    padding: 54px 84px 60px;
    min-height: 100%;
    position: relative;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25), 0 0 60px rgba(0, 0, 0, 0.5);
  }

  .runhead {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    color: var(--faint);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--prule);
  }

  .fhead { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; padding: 40px 0 28px; }
  .fhead .agency { font-size: 12.5px; letter-spacing: 0.09em; }
  .fhead .formno { font-size: 27px; font-weight: 700; letter-spacing: 0.16em; padding-top: 12px; }
  .fhead .act { font-size: 12.5px; letter-spacing: 0.045em; }

  .stamp {
    position: absolute;
    top: 108px;
    right: 46px;
    transform: rotate(-4.5deg);
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    font-family: var(--stampface);
    padding: 9px 15px 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1px;
    opacity: 0.86;
  }

  .stamp .s1 { font-size: 10px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; }
  .stamp .s2 { font-size: 21px; font-weight: 700; letter-spacing: 0.07em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stamp .s3 { font-size: 9.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; border-top: 1.5px solid var(--stamp); margin-top: 4px; padding-top: 3px; }

  .dbl { border-top: 3px double var(--ink); }

  .fitem { padding: 24px 0 0; }
  .fitem h2 { font-size: 14.5px; font-weight: 700; margin: 0 0 4px; }
  .fitem p { margin: 0 0 12px; max-width: 68ch; line-height: 1.72; text-wrap: pretty; }

  .ftable { width: 100%; border-collapse: collapse; margin-top: 12px; color: var(--ink); }
  .ftable th { font-size: 11.5px; font-weight: 400; letter-spacing: 0.05em; text-align: right; padding: 0 0 5px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  .ftable th.l { text-align: left; }
  .ftable td { padding: 4px 0; text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ftable td.l { text-align: left; padding-right: 16px; white-space: normal; }

  .fnotes { border-top: 1px solid var(--ink); margin-top: 22px; padding-top: 10px; font-size: 12px; line-height: 1.7; }
  .fnotes p { margin: 0 0 6px; max-width: 72ch; }

  .fsig { font-style: italic; font-size: 15.5px; padding: 12px 0 2px; }

  .fcolophon { border-top: 1px solid var(--prule); margin-top: 34px; padding-top: 12px; display: flex; justify-content: space-between; gap: 20px; font-size: 11.5px; color: var(--faint); }

  .sheet a { color: var(--ink); }
  .sheet a:hover { color: var(--stamp); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .app::before, .app::after { position: fixed; }
    .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .panel, .panel.tl, .panel.tr, .panel.bl, .panel.br { border-left: 0; border-right: 0; }
    .chart-wrap { height: 190px; }
    .body-pad { overflow: visible; }
    .sheet { padding: 32px 22px 44px; }
    .stamp { position: static; transform: rotate(-2deg); align-self: flex-end; margin: 12px 0 0; padding: 6px 11px 5px; }
    .stamp .s1 { font-size: 8.5px; letter-spacing: 0.18em; }
    .stamp .s2 { font-size: 16px; }
    .stamp .s3 { font-size: 8px; letter-spacing: 0.14em; }
    .stampwrap { display: flex; justify-content: flex-end; }
    .fhead { padding: 16px 0 22px; }
    .fhead .formno { font-size: 21px; }
    .fkeys { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .live { animation: none; }
    .app { animation: none; }
    .filing.on { animation: none; }
    * { transition-duration: 1ms !important; }
  }
</style>

    <span><b>/</b>COMMAND</span>
    <span class="grey">PRICES DELAYED BY ONE UNIVERSE &middot; NOTHING HERE SETTLES</span>
  </div>
</div>

    <button type="button" id="close-filing">CLOSE (ESC)</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Smooth shared wander: interpolates hashed values on a 6s lattice, so
   the tick is continuous, deterministic, and identical for everyone. */
function wander(ticker, seconds, amp) {
  const k = hash(ticker);
  const step = seconds / 6;
  const i = Math.floor(step);
  const f = step - i;
  const at = (n) => (hash(ticker + ':' + n) % 20001) / 10000 - 1;
  const a = at(i), b = at(i + 1);
  const s = f * f * (3 - 2 * f);
  const slow = Math.sin((seconds + (k % 600)) / 240) * 0.45;
  return (a + (b - a) * s + slow) * amp;
}

/* Market-wide shocks, so every listing correlates like a real index.
   Applied as a transient deviation on top of the walk, never compounded
   into it: a crash draws down and recovers, it does not reset the trend. */
const SHOCKS = [
  { at: 0.16, hit: -0.20 },
  { at: 0.41, hit: -0.29 },
  { at: 0.58, hit: -0.38 },
  { at: 0.78, hit: -0.24 },
  { at: 0.91, hit: 0.16 }
];

const FALL = 0.025, HEAL = 0.11;

function history(co, n) {
  const r = rng(hash(co.ticker));
  const out = [];
  let v = 100;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    v *= 1 + co.drift + co.vol * (r() - 0.5);
    let adj = 1;
    for (const s of SHOCKS) {
      const d = t - s.at;
      if (d > -FALL && d < HEAL) {
        const shape = d < 0 ? (d + FALL) / FALL : 1 - d / HEAL;
        adj *= 1 + s.hit * co.beta * shape * shape;
      }
    }
    out.push(v * adj);
  }
  const scale = co.close / out[out.length - 1];
  return out.map((x) => x * scale);
}

/* ---------------------------------------------------------------
   Listings
   --------------------------------------------------------------- */

const COMPANIES = [
  {
    ticker: 'DUFF',
    name: 'Duff Beer',
    sector: 'Household Names',
    close: 42.50, drift: 0.0062, vol: 0.040, beta: 0.5,
    from: 1989, cap: '3.8B', float: '54%', hq: 'Springfield', staff: 'Not disclosed',
    forkDate: '1989, Springfield',
    chief: 'DUFFMAN, HEAD OF PROMOTIONS',
    principals: [{"who": "Duffman", "note": "Head of Promotions. Fronted every product launch for thirty years. No employment contract on file."}, {"who": "The Plant Owner", "note": "Landlord of the brewery site and, separately, employer of the company’s single largest household customer. The overlap is undisclosed."}, {"who": "H. J. Simpson", "note": "Not an officer or a shareholder. Single largest household customer on record, by a wide margin."}],
    fork: 'The only beer anyone in this town drinks, brewed beside a nuclear plant everyone insists is fine. A costumed mascot has fronted every launch for thirty years. Nobody’s ever seen his contract.',
    thesis: 'One town, total market share, one lifelong customer doing more for retention than the whole ad budget.',
    notes: [

/* ---------------------------------------------------------------
   Terminal. The register is the landing view; the filing is a
   document you pull up on a registrant, as on any real desk.
   --------------------------------------------------------------- */

const SECTORS = ['Household Names', 'Delisted, still trading', 'Sinister Conglomerates'];
const HIST_N = 168;
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

COMPANIES.forEach((c) => {
  c.series = history(c, HIST_N);
  c.prev = c.series[c.series.length - 2];
});

const ORDERED = [];
SECTORS.forEach((s) => COMPANIES.filter((c) => c.sector === s).forEach((c) => ORDERED.push(c)));
ORDERED.forEach((c, i) => { c.ref = '5(' + LETTERS[i] + ')'; });

let sel = ORDERED[0].ticker;

function co(t) { return COMPANIES.find((c) => c.ticker === t); }
function now() { return Math.floor(Date.now() / 1000); }

function live(c) {
  const px = c.close * (1 + wander(c.ticker, now(), 0.031));
  const chg = px - c.prev;
  return { px: px, chg: chg, pct: (chg / c.prev) * 100 };
}

function fmt(n, dp) {
  const d = dp === undefined ? 2 : dp;
  return n.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function signed(n, dp) { return (n >= 0 ? '+' : '-') + fmt(Math.abs(n), dp); }
function acct(n, dp) { const v = fmt(Math.abs(n), dp); return n < 0 ? '(' + v + ')' : v; }
function cls(n) { return n < 0 ? 'neg' : 'pos'; }
function esc(s) { return String(s).replace(/&(?![a-z]+;|#\d+;)/g, '&amp;').replace(/</g, '&lt;'); }

   Register

const registerEl = document.getElementById('register');

function drawRegister() {
  let h = '';
  SECTORS.forEach((s) => {
    h += '<div class="cols sector-row"><span></span><span class="lbl">' + s.toUpperCase() +
      '</span><span></span><span></span><span></span></div>';
    COMPANIES.filter((c) => c.sector === s).forEach((c) => {
      h += '<button type="button" class="cols reg-row' + (c.ticker === sel ? ' on' : '') +
        '" data-t="' + c.ticker + '">' +
        '<span class="sym">' + c.ticker + '</span>' +
        '<span class="nm">' + esc(c.name) + '</span>' +
        '<span class="r num" data-px="' + c.ticker + '">' + fmt(c.close) + '</span>' +
        '<span class="r num" data-chg="' + c.ticker + '">&mdash;</span>' +
        '<span class="r num" data-pct="' + c.ticker + '">&mdash;</span>' +
        '</button>';
    });
  });
  registerEl.innerHTML = h;
  registerEl.querySelectorAll('.reg-row').forEach((b) => {
    b.addEventListener('click', () => select(b.dataset.t));
  });
}

/* ---------------------------------------------------------------
   Chart
   --------------------------------------------------------------- */

const PL = 6, PR = 42, PT = 12, PB = 20;
let CW = 460, CH = 230;
let geom = null;

function drawChart(c) {
  const box = document.getElementById('chart');
  CW = Math.max(240, Math.round(box.clientWidth || 460));
  CH = Math.max(140, Math.round(box.clientHeight || 230));
  const v = c.series;
  const iw = CW - PL - PR, ih = CH - PT - PB;
  const lo = Math.min.apply(null, v) * 0.96;
  const hi = Math.max.apply(null, v) * 1.04;
  const X = (i) => PL + (i / (v.length - 1)) * iw;
  const Y = (n) => PT + (1 - (n - lo) / (hi - lo)) * ih;
  geom = { v: v, X: X, Y: Y, iw: iw, from: c.from };

  let d = '';
  for (let i = 0; i < v.length; i++) d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v[i]).toFixed(1);
  const area = d + 'L' + X(v.length - 1).toFixed(1) + ' ' + (PT + ih) + 'L' + PL + ' ' + (PT + ih) + 'Z';

  let grid = '';
  for (let g = 0; g <= 2; g++) {
    const val = lo + ((hi - lo) * g) / 2;
    const y = Y(val).toFixed(1);
    grid += '<line x1="' + PL + '" x2="' + (PL + iw) + '" y1="' + y + '" y2="' + y +
      '" stroke="#1C1C1E" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<text x="' + (PL + iw + 6) + '" y="' + (parseFloat(y) + 3.5) +
      '" fill="#7A7A7F" font-family="IBM Plex Mono, monospace" font-size="9.5">' + fmt(val, 0) + '</text>';
  }

  const span = 2026 - c.from;
  const step = span > 40 ? 15 : span > 20 ? 10 : span > 8 ? 5 : 2;
  let ticks = '';
  for (let yr = c.from; yr <= 2026; yr += step) {
    const i = ((yr - c.from) / span) * (v.length - 1);
    const x = X(i);
    const anchor = x < PL + 18 ? 'start' : x > PL + iw - 18 ? 'end' : 'middle';
    ticks += '<text x="' + x.toFixed(1) + '" y="' + (CH - 5) + '" fill="#7A7A7F" text-anchor="' + anchor +
      '" font-family="IBM Plex Mono, monospace" font-size="9.5">' + yr + '</text>';
  }

  document.getElementById('chart').innerHTML =
    '<svg class="chart" id="svg" viewBox="0 0 ' + CW + ' ' + CH + '" role="img" aria-label="' +
    c.ticker + ' price from ' + c.from + ' to 2026">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#FFB000" stop-opacity="0.16"/>' +
    '<stop offset="100%" stop-color="#FFB000" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#g)"/>' +
    '<path d="' + d + '" fill="none" stroke="#FFB000" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
    '<line id="cx" x1="0" x2="0" y1="' + PT + '" y2="' + (PT + ih) + '" stroke="#F2F1EC" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>' +
    '<rect x="' + (X(v.length - 1) - 2.4).toFixed(1) + '" y="' + (Y(v[v.length - 1]) - 2.4).toFixed(1) +
    '" width="4.8" height="4.8" fill="#FFB000"/>' +
    ticks + '</svg>';

  document.getElementById('chart-title').textContent = '2) ' + c.ticker + ' CHART';
  document.getElementById('chart-range').textContent = c.from + '-2026';
  document.getElementById('readout').textContent = '';

  const svg = document.getElementById('svg');
  const cx = document.getElementById('cx');
  const ro = document.getElementById('readout');

  function move(e) {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * CW;
    let i = Math.round(((px - PL) / iw) * (v.length - 1));
    i = Math.max(0, Math.min(v.length - 1, i));
    const x = X(i);
    cx.setAttribute('x1', x); cx.setAttribute('x2', x); cx.setAttribute('opacity', '0.4');
    const yr = c.from + Math.round((i / (v.length - 1)) * span);
    ro.innerHTML = yr + ' &nbsp;<b>' + fmt(v[i]) + '</b>';
  }
  function leave() { cx.setAttribute('opacity', '0'); ro.textContent = ''; }

  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', leave);
  svg.addEventListener('touchmove', (e) => move(e.touches[0]), { passive: true });
  svg.addEventListener('touchend', leave);
}

      '<span class="lbl">SECTOR</span><span>' + c.sector.toUpperCase() + '</span>' +
      '<span class="lbl">CHIEF</span><span>' + esc(c.chief) + '</span>' +
      '<span class="lbl">HQ</span><span>' + esc(c.hq.toUpperCase()) + '</span>' +
      '<span class="lbl">MKT CAP</span><span>' + c.cap + '&nbsp;&nbsp;<span class="lbl">FLOAT</span> ' + c.float +
      '&nbsp;&nbsp;<span class="lbl">STAFF</span> ' + esc(c.staff.toUpperCase()) + '</span>' +
    '</div>' +
    '<div class="thesis">' + c.thesis + '</div>' +
    '<div class="cov"><span class="lbl" style="grid-column: 1 / -1; font-size: 11px; letter-spacing: 0.1em;">COVERAGE</span>' +
    cov + '</div>';
}

function drawWire(c) {
  document.getElementById('wire-sym').textContent = c.ticker;
  const t = Date.now();
  document.getElementById('wire').innerHTML = '<div class="wire">' +
    c.wire.map((w, i) => {
      const d = new Date(t - (i * 47 + 12) * 60000);
      const hh = String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
      return '<span class="t num">' + hh + '</span><span>' + w + '</span>';
    }).join('') + '</div>';
}

/* ---------------------------------------------------------------
   Filing. The prospectus, pulled up on one registrant.
   --------------------------------------------------------------- */

const filingEl = document.getElementById('filing');

function drawFiling(c) {
  const l = live(c);
  const rows = ORDERED.map((r) => {
    const rl = live(r);
    const me = r.ticker === c.ticker;
    return '<tr' + (me ? ' style="font-weight:700;"' : '') + '>' +
      '<td class="l">' + r.ticker + '</td>' +
      '<td class="l">' + esc(r.name) + (me ? '' : '') + '</td>' +
      '<td>' + fmt(rl.px) + '</td>' +
      '<td>' + acct(rl.chg) + '</td>' +
      '<td>' + acct(rl.pct) + '</td>' +
      '<td>' + r.cap.replace('B', '') + '</td>' +
      '<td>' + r.ref.slice(1) + '</td></tr>';
  }).join('');

  document.getElementById('filing-label').textContent =
    'EXHIBIT ' + c.ref + ' — ' + c.name.toUpperCase() + ' — FORM S-1';

  document.getElementById('sheet').innerHTML =
    '<div class="runhead"><span>Mooch Stock Exchange</span>' +
    '<span>Form S-1 &middot; Amended continuously</span></div>' +

    '<div class="stampwrap"><div class="stamp">' +
      '<span class="s1">Amendment No.</span>' +
      '<span class="s2 num" id="amend">&mdash;</span>' +
      '<span class="s3">Filed continuously</span>' +
    '</div></div>' +

    '<div class="fhead">' +
      '<span class="agency">UNITED STATES SECURITIES AND EXCHANGE COMMISSION</span>' +
      '<span class="agency">Washington, D.C. 20549</span>' +
      '<span class="formno">FORM S-1</span>' +
      '<span class="act">REGISTRATION STATEMENT UNDER THE SECURITIES ACT OF 1933</span>' +
    '</div>' +

    '<div class="dbl"></div>' +
    '<div class="runhead" style="border-bottom: 1px solid var(--ink); padding-top: 8px;">' +
      '<span>' + esc(c.name.toUpperCase()) + ' (' + c.ticker + ')</span>' +
      '<span class="num" id="fasof">&mdash;</span></div>' +

    '<section class="fitem"><h2>Item ' + c.ref + '. ' + esc(c.name) + '.</h2>' +
      '<p>' + c.fork + '</p>' +
      '<p>' + c.thesis + '</p>' +
      '<p>The registrant has no underlying that exists. Settlement remains suspended pending same. ' +
      'Registered office: ' + esc(c.hq) + '. Employees: ' + esc(c.staff) + '. ' +
      'Free float ' + c.float + '. First appearance ' + c.from + '.</p>' +
    '</section>' +

    '<section class="fitem"><h2>Item 5. Market for Registrants&rsquo; Common Equity.</h2>' +
      '<p>The composite index of admitted listings stood at <b class="num" id="fidx">&mdash;</b> at the time of ' +
      'filing. Prices are stated in United States dollars and are delayed by one universe. ' +
      'The registrant last traded at <b class="num" id="fpx">' + fmt(l.px) + '</b>.</p>' +
      '<table class="ftable"><thead><tr>' +
      '<th class="l" style="width: 74px;">SYMBOL</th><th class="l">REGISTRANT</th>' +
      '<th>PRICE($)</th><th>CHANGE($)</th><th>CHANGE(%)</th><th>CAP($BN)</th><th style="width:44px;">ITEM</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '</section>' +

    '<section class="fitem"><h2>Item 6. Directors and Principal Shareholders.</h2>' +
      c.principals.map((pr) => '<p><b>' + pr.who + '.</b> ' + pr.note + '</p>').join('') +
    '</section>' +

    '<section class="fitem"><h2>Item 7. Analyst Coverage.</h2>' +
      c.notes.map((n) => '<p><b>' + n.src + ' &mdash; ' + n.rec.toUpperCase() + '.</b> ' + n.q + '</p>').join('') +
    '</section>' +

    '<div class="fnotes">' +
      '<p>(1) Price history is indexed from first appearance rather than from admission. Drawdowns common to every ' +
      'listing are exchange-wide and are not registrant events.</p>' +
      '<p>(2) This statement is amended once per second and is superseded by its own next amendment.</p>' +
    '</div>' +

    '<section class="fitem"><h2>SIGNATURES</h2>' +
      '<p>Pursuant to the requirements of the Securities Act of 1933, this registration statement has been signed ' +
      'on behalf of the registrant by the party responsible for its clearing and custody, the registrant not being ' +
      'available to sign on its own behalf.</p>' +
      '<p class="fsig">/s/ Mooch Agency Holdings</p>' +
      '<p style="font-size: 12.5px; color: var(--faint);">Clearing and custody &middot; ' +
      '<a href="https://mooch.agency">mooch.agency</a></p>' +
    '</section>' +

    '<div class="fcolophon"><span>Prices in USD. Delayed by one universe. Nothing here settles.</span>' +
    '<span class="num">1</span></div>';
}

function openFiling() {
  drawFiling(co(sel));
  filingEl.classList.add('on');
  filingEl.scrollTop = 0;
  document.getElementById('close-filing').focus();
  tick();
}

function closeFiling() {
  filingEl.classList.remove('on');
  const row = registerEl.querySelector('.reg-row[data-t="' + sel + '"]');
  if (row) row.focus();
}

/* ---------------------------------------------------------------
   Selection
   --------------------------------------------------------------- */

function select(t, focus) {
  if (!co(t)) return;
  sel = t;
  registerEl.querySelectorAll('.reg-row').forEach((b) => {
    b.classList.toggle('on', b.dataset.t === sel);
  });
  const c = co(sel);
  drawChart(c);
  drawDescription(c);
  drawWire(c);
  if (filingEl.classList.contains('on')) drawFiling(c);
  if (focus) {
    const row = registerEl.querySelector('.reg-row[data-t="' + sel + '"]');
    if (row) row.focus();
  }
  tick();
}

function step(delta) {
  const i = ORDERED.findIndex((c) => c.ticker === sel);
  const n = (i + delta + ORDERED.length) % ORDERED.length;
  select(ORDERED[n].ticker, true);
}

/* ---------------------------------------------------------------
   Command line
   --------------------------------------------------------------- */

const cmdEl = document.getElementById('cmd');
const msgEl = document.getElementById('cmdmsg');

function say(m) {
  msgEl.textContent = m;
  clearTimeout(say._t);
  say._t = setTimeout(() => { msgEl.textContent = ''; }, 4000);
}

document.getElementById('cmdform').addEventListener('submit', (e) => {
  e.preventDefault();
  const raw = cmdEl.value.trim().toUpperCase();
  cmdEl.value = '';
  if (!raw) return;

  const parts = raw.split(/\s+/);
  const head = parts[0];

  if (head === 'HELP') { say('SYMBOL selects. SYMBOL FIL opens the filing. LS lists. ESC closes.'); return; }
  if (head === 'LS') { say(ORDERED.map((c) => c.ticker).join(' ')); return; }

  const hit = co(head);
  if (!hit) { say('NO SUCH ISSUE: ' + head); return; }

  select(hit.ticker);
  if (parts[1] === 'FIL' || parts[1] === 'FILING' || parts[1] === 'S1') { openFiling(); say(''); }
  else { say(hit.ticker + ' SELECTED'); }
});

document.addEventListener('keydown', (e) => {
  const typing = e.target === cmdEl;

  if (e.key === 'Escape') {
    if (filingEl.classList.contains('on')) { closeFiling(); e.preventDefault(); }
    else if (typing) { cmdEl.blur(); }
    return;
  }
  if (e.key === 'F6') { e.preventDefault(); filingEl.classList.contains('on') ? closeFiling() : openFiling(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); cmdEl.focus(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); step(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
});

document.getElementById('open-filing').addEventListener('click', openFiling);
document.getElementById('close-filing').addEventListener('click', closeFiling);

/* ---------------------------------------------------------------
   Tick
   --------------------------------------------------------------- */

const BASE = COMPANIES.reduce((s, c) => s + c.close, 0) / COMPANIES.length;

function tick() {
  let sum = 0, prevSum = 0;
  COMPANIES.forEach((c) => {
    const l = live(c);
    sum += l.px;
    prevSum += c.prev;
    document.querySelectorAll('[data-px="' + c.ticker + '"]').forEach((e) => { e.textContent = fmt(l.px); });
    document.querySelectorAll('[data-chg="' + c.ticker + '"]').forEach((e) => {
      e.textContent = signed(l.chg);
      e.className = 'r num ' + cls(l.chg);
    });
    document.querySelectorAll('[data-pct="' + c.ticker + '"]').forEach((e) => {
      e.textContent = signed(l.pct);
      e.className = 'r num ' + cls(l.chg);
    });
  });

  const idx = (sum / COMPANIES.length / BASE) * 4180;
  const prev = (prevSum / COMPANIES.length / BASE) * 4180;
  const d = idx - prev;
  document.getElementById('idx').textContent = fmt(idx);
  const ic = document.getElementById('idxchg');
  ic.textContent = signed(d) + ' ' + signed((d / prev) * 100) + '%';
  ic.className = 'num ' + cls(d);

  const t = new Date();
  const hh = String(t.getUTCHours()).padStart(2, '0');
  const mm = String(t.getUTCMinutes()).padStart(2, '0');
  const ss = String(t.getUTCSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = hh + ':' + mm + ':' + ss;

  const fidx = document.getElementById('fidx');
  if (fidx) fidx.textContent = fmt(idx);
  const fpx = document.getElementById('fpx');
  if (fpx) fpx.textContent = fmt(live(co(sel)).px);
  const amend = document.getElementById('amend');
  if (amend) amend.textContent = (4200000 + (now() % 100000)).toLocaleString('en-GB');
  const fasof = document.getElementById('fasof');
  if (fasof) fasof.textContent = 'AS OF 22 AUGUST 2026, ' + hh + ':' + mm + ':' + ss + ' UTC';
}

let rt = null;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => drawChart(co(sel)), 120);
});

document.getElementById('count').textContent = COMPANIES.length;
drawRegister();
select(sel);
setInterval(tick, 1000);

</script>
